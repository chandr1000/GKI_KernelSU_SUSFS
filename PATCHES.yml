# PATCHES.yml — the OPERATIVE manifest for the `feature/patches` series (v3)
# ================================================================================
# This file is parsed by the generic applier on `main-chandr1000`
# (.github/actions/feature-patches) — it is the thing the build runs, not just
# documentation (plan v3.0.0 §3.2, decisions D15–D19).
#
#   series.apply   : git-apply (D15) — strict `git apply --check` then apply,
#                    .rej/.log collected as artifacts on failure. git apply
#                    matches hunks ONLY at their stated line (no offset
#                    search) and rejects insertions without context on BOTH
#                    sides (EOF appends included) - every hunk below is
#                    anchored accordingly (incident run 42248382967).
#   series.order   : list order below == apply order (depends_on validated at
#                    parse time; a disabled/failed dep auto-skips dependents
#                    LOUDLY in the step summary)
#   kernels        : gated on VERSION/PATCHLEVEL read from the tree's own
#                    kernel Makefile (D18) — not on dispatch inputs
#   best_effort    : true ⇒ apply failure = ::warning:: + skip (never red);
#                    false ⇒ apply failure = red build. Flip to false once a
#                    probe family passes its canary (Phase E).
#   config         : emitted by the applier into the existing set-kernel-config
#                    step (D17) — patches never touch defconfig
#   A/B bore 6.6   : flip `enabled` between the 5.9.6 entry and the 5.1.0
#                    entry here (no dispatch knob — §3.5)
#
# Plan: integration_plan_feature_patches_v3.0.0.md; deltas tracked in
# integration_plan v3.0.2 (KABI/CRC shield + D17 fragment fix, 2026-11-07)
# Commit identity: Irina Shinakawa <25380803+chandr1000@users.noreply.github.com>

series:
  branch: feature/patches
  base: android15-6.6 @ 6.6.77 (android15-2025-03)   # kernel tree the diffs are generated against (recorded, not fetched)
  apply: git-apply                 # applier mechanism (D15)
  order: list-order                # series apply order == list order (depends_on validated at parse time)

patches:
  # --- F1: BORE scheduler ---------------------------------------------------
  - id: bore-scheduler                   # 6.6 default variant (5.9.6 generation)
    enabled: false
    kind: patch
    patch: patches/bore/0001-linux6.6.67-gki-bore-5.9.6.patch
    kernels: ["6.6"]
    depends_on: []
    best_effort: false
    config: [CONFIG_SCHED_BORE=y, CONFIG_MIN_BASE_SLICE_NS=2000000]
    title: BORE scheduler (Burst-Oriented Response Enhancer)
    author: Masahito Suzuki (firelzrd)    # https://github.com/firelzrd/bore-scheduler
    port: WildKernels GKI_KernelSU_SUSFS (27cb8b3e, be224605, c606cc2a, eba7eac4, c2f54d01, 06488106)
    notes: >
      REGENERATED strict git-apply form of the vendored 5.9.6 patch: the
      original had a known-rejecting sysctl hunk on GKI; the regenerated
      diff bakes in the full proven fixup sequence (task_of fwd decl,
      out-of-line burst state via bore66_state/flat, decl hoists, GKI
      sysctl repair — scripts/bore_66_apply.sh) and applies under strict
      git apply. KMI stays stock via the DroidSpaces slot-merge.
      INCIDENT RUN 42292466832 (round 2): the task_struct hunk anchored
      its trailing context on ANDROID_KABI_RESERVE(6)/(7)/(8) — exactly
      the lines DroidSpaces' sysvipc KABI fix
      (001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch, workflow step 26)
      converts to `#ifdef CONFIG_SYSVIPC` ANDROID_KABI_USE/_REPLACE
      before this applier runs, so the 9-line pre-image no longer existed
      and git apply --check failed while D19 (declared pristine base)
      stayed green. group_burst moved to KABI slots 1/2: the hunk now
      replaces RESERVE(1)/(2) and keeps RESERVE(3)/(4)/(5) as trailing
      context — byte-identical pre- and post-DroidSpaces, so one hunk
      serves both the D19 base and the runtime tree (both verified).
      task_struct slot map: 1/2 BORE group_burst, 3/4/5 free, 6/7/8
      DroidSpaces sysvipc; sched_entity 1-4 BORE.
      ROUND-3 HARDENING (run 42300760345): bore.c parsed the private
      sched.h with no direct cputime.h include — it compiled only via
      transitive-include luck on every leg so far. cputime.h hoisted
      above sched.h (fair.c order), matching the governor TUs.
      RUNTIME INCIDENT CLOSED (kunzite boot panic, dmesg-ramoops-0
      captured 2026-11-07): the raw on_rq/rel_deadline hunk in
      sched_entity (unsigned int -> 2×unsigned char, layout-neutral via
      padding) is genksyms-VISIBLE, and its CRC delta propagated
      transitively to 5,965 symbols incl. the module_layout canary
      (0x4e276f37 -> 0xb60e8dc8). The device enforces MODVERSIONS, so
      every OEM vendor module was rejected at first-stage init
      ("disagrees about version of symbol module_layout", UFS PHY
      included) -> init timed out waiting for partitions and exited ->
      "Attempted to kill init" panic ~10.3s, no boot animation. FIX:
      __GENKSYMS__ shield on that hunk (genksyms sees the stock
      `unsigned int on_rq;`; runtime code byte-identical). The two
      _ANDROID_KABI_REPLACE slot hunks need no shield: ACK
      android_kabi.h maps them to the stock reserves under
      __GENKSYMS__ already. ABI gate expectation after fix: 0
      CRC-DELTA (was 5,965).

  - id: bore-scheduler-66-510            # 6.6 ALTERNATIVE variant (5.1.0 generation)
    enabled: false                       # A/B: enable this, disable bore-scheduler
    kind: patch
    patch: patches/bore/0002-linux6.6.67-gki-bore-5.1.0.patch
    kernels: ["6.6"]
    depends_on: []
    best_effort: false
    config: [CONFIG_SCHED_BORE=y, CONFIG_MIN_BASE_SLICE_NS=2000000]
    title: BORE scheduler (5.1.0-generation patch for 6.6, alternative variant)
    author: Masahito Suzuki (firelzrd)
    port: WildKernels GKI_KernelSU_SUSFS (vendored 5.1.0 variant)
    notes: >
      Regenerated strict form of the vendored 5.1.0 variant incl. its
      proven fixups (sched_entity 4-slot relocation + GKI sysctl repairs —
      scripts/bore_66_510_apply.sh). Mutually exclusive with bore-scheduler;
      the fair.c gaming-bias anchors are cut against the 5.9.6 tree.
      A/B WARNING (2026-11-07): before flipping this on, audit its
      sched.h hunks for raw (non-KABI-macro) struct edits the same way
      the 5.9.6 entry's on_rq hunk needed a __GENKSYMS__ shield — any
      genksyms-visible field change drifts module_layout and bricks
      MODVERSIONS devices at first-stage init (see bore-scheduler notes).

  - id: bore-scheduler-legacy-510-515    # 5.10 + 5.15 probe families
    enabled: false
    kind: patch
    patch: patches/bore/legacy/0001-linux5.15.y-bore5.1.0.patch
    kernels: ["5.10", "5.15"]
    depends_on: []
    best_effort: true                    # probe family — flip to false after the family canary
    config: [CONFIG_SCHED_BORE=y, CONFIG_MIN_BASE_SLICE_NS=2000000]
    title: BORE scheduler (author's pinned 5.15 legacy patch; applies to 5.10 too)
    author: Masahito Suzuki (firelzrd)
    port: vendored from firelzrd patches/legacy/linux-5.15-bore (pinned URL, was fetched at build time)
    notes: >
      Vendored verbatim (same bytes the old action fetched). 14-15/14 hunks
      clean per the proven action. 5.10 needs the task_of fwd decl + the
      8-scalar KABI relocation — see bore-kabi-legacy below.

  - id: bore-scheduler-legacy-61         # 6.1 probe family
    enabled: false
    kind: patch
    patch: patches/bore/legacy/0001-linux6.1.y-bore5.1.0.patch
    kernels: ["6.1"]
    depends_on: []
    best_effort: true                    # probe family — flip to false after the family canary
    config: [CONFIG_SCHED_BORE=y, CONFIG_MIN_BASE_SLICE_NS=2000000]
    title: BORE scheduler (author's pinned 6.1 legacy patch)
    author: Masahito Suzuki (firelzrd)
    port: vendored from firelzrd patches/legacy/linux-6.1-bore (pinned URL, was fetched at build time)
    notes: >
      14/14 hunks clean per the proven action; KABI relocation via
      bore-kabi-legacy.

  - id: bore-kabi-legacy
    enabled: false
    kind: script
    script: scripts/bore_5x_fixup.sh
    kernels: ["5.10", "5.15", "6.1"]
    depends_on: [bore-scheduler-legacy-510-515, bore-scheduler-legacy-61]
    best_effort: true
    title: BORE legacy-family fixups (task_of fwd decl, decl hoists, KABI relocation)
    author: "TheWildJames (WildKernels) — bore_kabi_612.py; packaging: this repo"
    notes: >
      Step bodies byte-verbatim from the proven bore action. The depends_on
      ids are kernel-gated, so on 5.15 only the 5.15 patch counts as the
      active dep; on 6.1 only the 6.1 patch.

  - id: bore-scheduler-612
    enabled: false
    kind: script
    script: scripts/bore_612_apply.sh
    kernels: ["6.12"]
    depends_on: []
    best_effort: true
    title: BORE scheduler (dynamic resolution from firelzrd patches/stable, retry + git fallback)
    author: "Masahito Suzuki (firelzrd); resolver: TheWildJames (WildKernels)"
    port: WildKernels GKI_KernelSU_SUSFS (bore action select/download/verify/apply steps, byte-verbatim)
    notes: >
      The 6.12 patch cannot be vendored stably (the author renews
      patches/stable/ and DELETES old files — pinned names 404'd across 27
      jobs). Resolves the newest stable patch at build time (API listing
      with git-clone fallback), verifies provenance, applies, relocates
      bore_ctx out-of-line (bore12_state/flat — fixes the task_struct KMI
      bootloop class) and repairs the fuzz-spliced update_curr_bore block.

  # --- F2: Reflex governor ---------------------------------------------------
  - id: governor-reflex
    enabled: true
    kind: patch
    patch: patches/reflex/0001-cpufreq-reflex-governor.patch
    kernels: ["5.15", "6.1", "6.6", "6.12"]      # 5.15 proven (Nao-YM CI); 6.x port-fixed after run 114269594026; 5.10: no sched_cpu_util — skipped
    depends_on: []                        # standalone — no shim dependency
    best_effort: false
    config: [CONFIG_CPU_FREQ_GOV_REFLEX=y]
    title: Reflex CPUFreq governor
    author: Masahito Suzuki (firelzrd)    # https://github.com/firelzrd/reflex
    port: Nao-YM/GKI_KernelSU_SUSFS (a60fcf3f)
    notes: >
      No CONFIG_CPU_FREQ_DEFAULT_GOV_REFLEX on purpose: proven not to work
      upstream and reverted there. The embedded copy is the earlier
      hispeed-blend generation, not firelzrd v0.4.0. cputime.h include-order
      fix (aacfc1b9 + 4d26dddb) folded — re-folded after run 42300760345:
      the v3 Phase A regen had silently dropped it and cpufreq_reflex.o
      only compiled via transitive-include luck. Makefile insert re-anchored between
      build_policy/build_utility (was: EOF app after bore.o - a bore failure
      used to cascade here; run 42248382967).

  # --- F3: Vorpal governor + compat shim -------------------------------------
  - id: governor-vorpal
    enabled: true
    kind: patch
    patch: patches/vorpal/0001-cpufreq-vorpal-governor-gki510-compat.patch
    kernels: ["5.15", "6.1", "6.6", "6.12"]      # 5.15 proven; 6.x pending validation (public APIs only); 5.10 skipped
    depends_on: []
    best_effort: false
    config: [CONFIG_CPU_FREQ_GOV_VORPAL=y]
    provides: [sched_gaming_active, rfx_get_util_gki510, rfx_dl_bw_exceeded_gki510]
    title: Vorpal CPUFreq Governor v2.0 (Perfect Gaming & Thermal Edition)
    author: Templar Dev (Steambot12)      # via kusonekoworld-max/MomenToMoiX-Kernel-GKI
    port: Nao-YM/GKI_KernelSU_SUSFS (a60fcf3f)
    notes: >
      rfx_gki510_compat.c (obj-y, always built) is the SOLE definer of
      sched_gaming_active in this tree — Bara-no-Seidou and the fair.c
      gaming bias consume it. Disabling vorpal auto-skips both (loud, in
      the summary). Input-handler init-bug fix folded. Makefile insert
      re-anchored between fair.o/build_policy and Kconfig block moved
      inside the menu (endif|endmenu) - both were EOF-coupled to reflex's
      apply state (run 42248382967 cascade).
      INCIDENT RUN 42300760345 (round 3): the Phase A regen rebuilt this
      patch from a pre-fix source snapshot, re-breaking the
      cputime.h-before-sched.h order — the obj-y shim died at
      sched.h:3349 (implicit account_group_exec_runtime) plus the
      slash-star in the old comment glob under -Werror. Re-land of
      1f085491, blob-identical post-image (debc7491).

  # --- F4: Bara-no-Seidou governor -------------------------------------------
  - id: governor-bara-no-seidou
    enabled: true
    kind: patch
    patch: patches/bara-no-seidou/0001-cpufreq-bara-no-seidou-governor.patch
    kernels: ["5.15", "6.1", "6.6", "6.12"]      # 5.15 proven; 6.x pending validation; 5.10 skipped
    depends_on: [governor-vorpal]         # needs sched_gaming_active from the shim
    best_effort: false
    config: [CONFIG_CPU_FREQ_GOV_BARA_NO_SEIDOU=y]
    title: Bara-no-Seidou CPUFreq governor (battery + auto gaming mode)
    author: kusonekoworld-max (koneko_dev) # MomenToMoiX-Kernel-GKI, intro aeacdbf 2026-07-30
    port: Nao-YM/GKI_KernelSU_SUSFS (f1c0fc5f)
    notes: >
      Consumes sched_gaming_active from the vorpal shim. local_clock
      include fix (1e4570af) folded — this is the file whose stale copy
      caused incident round 3. Makefile insert re-anchored between
      core.o/fair.o; the Kconfig block stays after vorpal's (the manifest
      depends_on is intentional - the shim symbol).
      cputime.h include-order re-land as well (run 42300760345): the
      Phase A regen lost it here too; compiled only via transitive
      include luck before the fix.

  # --- F6: fair.c gaming bias -------------------------------------------------
  - id: fair-gaming-bias
    enabled: true
    kind: patch
    patch: patches/gaming-bias/0001-fair-c-gaming-mode-bias.patch
    kernels: ["6.6"]                        # anchors cut against EEVDF 6.6.77 post-BORE
    depends_on: [governor-vorpal, bore-scheduler]
    best_effort: true                     # anchor drift ⇒ warn + skip, never red (D16)
    title: CFS gaming-mode bias (vruntime stretch / half-slice yield / migration isolation)
    author: "MomenToMoiX project (koneko_dev); EEVDF 6.6 anchor port: this repo"
    port: Nao-YM/GKI_KernelSU_SUSFS (a60fcf3f)
    notes: >
      ANCHOR FINDING (Phase A): 3 of the 5 upstream injections target
      pre-EEVDF shapes (check_preempt_tick, normalized_sysctl_sched_latency,
      adjacent update_min_vruntime) that do not exist on android15-6.6 —
      the old warn+skip step NEVER applied on this base; the pre-reset
      "green" builds ran WITHOUT the bias. Injections 1-3 are ported to
      the EEVDF shapes with identical semantics (calc_delta_fair/
      update_deadline adjacency, curr->slice for ideal_runtime);
      injections 4-5 are byte-identical to the proven action. Series-
      ordered after bore (parent = post-BORE fair.c) and vorpal (shim).

