             CONFIG_CPU_IDLE_GOV_TEO=y, CONFIG_WQ_POWER_EFFICIENT_DEFAULT=y, CONFIG_PM_WAKELOCKS=y,
             CONFIG_PM_WAKELOCKS_LIMIT=100, CONFIG_PM_WAKELOCKS_GC=y, CONFIG_SUSPEND=y,
             CONFIG_DEVFREQ_GOV_PERFORMANCE=y, CONFIG_DEVFREQ_GOV_PASSIVE=y, CONFIG_UCLAMP_TASK=y,
             CONFIG_UCLAMP_TASK_GROUP=y, CONFIG_CMA=y, CONFIG_DMA_CMA=y, CONFIG_MQ_IOSCHED_KYBER=y,
             CONFIG_SUSPEND_FREEZER=y, CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y, CONFIG_ENERGY_MODEL=y,
             CONFIG_SCHED_MC=y, CONFIG_NO_HZ_IDLE=y, CONFIG_NO_HZ_FULL=n]
    title: MomenToMoiX (Tenebrion) screen/charging/thermal QoS driver
    author: "koneko_dev; Tenebrion logic + SELinux rules: Kanagawa Yamada (LoggingNewMemory)"
    port: Nao-YM/GKI_KernelSU_SUSFS (69a2d582, 25ae398b)
    notes: >
      The MGLRU/KSM/zram-zstd/zsmalloc-stats/BFQ/PSI/uclamp config block
      moved from the old action's set-kernel-config step into this
      manifest config: field (D17). drivers/Makefile insert moved off the
      EOF anchor (after DRM_ACCEL/accel/) - root-setup appends
      obj-$(CONFIG_KSU) += kernelsu/ to the EOF region first, and git apply
      refuses EOF-anchored hunks on a file that grew past them (THE run
      42248382967 root cause, reproduced locally).

  - id: momentomoix-selinux
    enabled: true
    kind: script
    script: scripts/selinux.sh
    kernels: ["5.10", "5.15", "6.1", "6.6", "6.12"]
    depends_on: [momentomoix-driver]
    best_effort: true                     # D4 KSU-flavor guard inside (warn + skip)
    title: Tenebrion SELinux rules injection (KernelSU-family rules.c)
    author: Kanagawa Yamada (LoggingNewMemory) — adapted from the SuiKernel pattern
    port: Nao-YM/GKI_KernelSU_SUSFS
    notes: >
      Self-contained: the rules.c discovery + D4 warn+skip guard moved
      inside the script (it lived in the old momentx action step). On root
      flavors without a ksu_allow table the driver still builds.

infrastructure:
  - id: abi-gate                          # lives on main-chandr1000 (runner), re-landed by the v3 wiring
    kind: ci-guard
    enabled: true                         # abi_gate dispatch input: warn (default, phase A per D11) | enforce | off; "+fail-new" suffix = D9 canary
    title: ABI gate — existing-symbol CRC zero-delta vs this run's pristine baseline
    author: "Irina Shinakawa (chandr1000) — gate design + script originate from this repo's gki6677 work (G1 closed 2026-11-01)"
    files: [.github/scripts/abi-gate.sh, .github/actions/build-kernel/action.yml (idempotency guard), .github/workflows/build.yml (two-phase wiring), .github/workflows/main.yml (input threading)]
    kernels: ["5.10", "5.15", "6.1", "6.6", "6.12"]
    dispatch: [abi_gate]
    notes: >
      Two-tier design (plan v2.2.0 §12.4, unchanged in v3 §11): Tier 1
      captures the baseline per gated run from the pristine pre-feature
      tree (every delta is patch-induced by construction; steady state
      0 drifted / 0 missing / <=3 new info). Tier 2 (pinned gki<digits>
      branches) keeps the frozen-baseline machinery, later. The
      diagnostics layer (keep-going kbuild + error capture) re-lands
      gated behind the ACTIONS_RUNNER_DEBUG repo toggle — D20, §3.8.

