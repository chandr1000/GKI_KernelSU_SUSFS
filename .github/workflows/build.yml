name: Kernel Build Process
permissions:
  contents: write
  actions: write

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      sublevel:
        required: true
        type: string
      os_patch_level:
        required: true
        type: string
      runner:
        description: 'Runner image label (ubuntu-24.04 or ubuntu-latest); lets a single leg be A/B tested'
        required: false
        type: string
        default: 'ubuntu-24.04'
      variant:
        required: false
        type: string
      feature_set:
        required: true
        type: string
      ksu_branch:
        required: false
        type: string
        default: ""
      susfs_commit:
        required: false
        type: string
        default: ""
      root_flavor:
        required: false
        type: string
        default: ""
      root_commit:
        required: false
        type: string
        default: ""
      nomount_commit:
        required: false
        type: string
        default: ""
      kernel_patches_commit:
        required: false
        type: string
        default: ""
      anykernel3_commit:
        required: false
        type: string
        default: ""
      droidspaces_commit:
        required: false
        type: string
        default: ""
      brand_name:
        required: false
        type: string
        default: Wild
      keep_kmi:
        required: false
        type: boolean
        default: false
      allow_version_mismatch:
        required: false
        type: boolean
        default: false
      use_cache:
        description: "Enable ccache/bazel cache (restore/save via release buckets)"
        required: false
        type: boolean
        default: false
      page_size:
        description: "ARM64 page size: 4k (default) or 16k (Kleaf --page_size)"
        required: false
        type: string
        default: "4k"
      stock_config_artifact:
        description: "Artifact name with prefetched stock configs (stock_<kver>[_16k].config)"
        required: false
        type: string
        default: ""

jobs:
  build-gki:
    name: "${{ inputs.kernel_version }}.${{ inputs.sublevel }}-${{ inputs.android_version }}-${{ inputs.os_patch_level }} (${{ inputs.variant }})"
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 120
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Download Prefetched Stock Configs
        if: inputs.stock_config_artifact != ''
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.stock_config_artifact }}
          path: stock-configs

      - name: Validate Page Size
        shell: bash
        run: |
          set -euo pipefail
          PAGE_SIZE="${{ inputs.page_size }}"
          case "$PAGE_SIZE" in
            4k) exit 0 ;;
            16k) ;;
            *) echo "ERROR: unsupported page_size '$PAGE_SIZE' (expected 4k or 16k)." >&2; exit 1 ;;
          esac
          # Kleaf exposes --page_size only on the build branches used by these
          # GKI families (main-kernel-build-2023/2024, main-kernel-2025).
          case "${{ inputs.version }}" in
            android14-6.1|android15-6.6|android16-6.12) ;;
            *)
              echo "ERROR: page_size=16k is not supported for ${{ inputs.version }}." >&2
              echo "Supported families: android14-6.1, android15-6.6, android16-6.12." >&2
              exit 1
              ;;
          esac

      - name: Emergency Disk Cleanup
        if: false
        uses: ./.github/actions/disk-cleanup

      - name: Free Disk Space
        if: true
        uses: endersonmenezes/free-disk-space@v4 # Use @main for latest, @v3 for stable
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz" # Use 'rmz' for faster deletion (default: 'rm')
          rmz_version: "3.2.0" # Required when rm_cmd is 'rmz'
          testing: false

      - name: Setup more Swap (for LTO)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment
        with:
          version: ${{ inputs.version }}
          sublevel: ${{ inputs.sublevel }}
          kernel_patches_commit: ${{ inputs.kernel_patches_commit }}
          anykernel3_commit: ${{ inputs.anykernel3_commit }}

      - name: Download Kernel Repository
        uses: ./.github/actions/download-kernel
        with:
          version: ${{ inputs.version }}
          android_version: ${{ inputs.android_version }}
          kernel_version: ${{ inputs.kernel_version }}
          os_patch_level: ${{ inputs.os_patch_level }}

      - name: Spoof /proc/config.gz With Stock Config
        uses: ./.github/actions/stock-config
        with:
          version: ${{ inputs.version }}
          page_size: ${{ inputs.page_size }}
          stock_config_dir: stock-configs

      - name: Set Build Timestamp from Kernel Commit
        shell: bash
        run: |
          set -x
          # Hardcode the build timestamp to the 5th day of the patch level
          # at 04:20 UTC, using the existing timestamp formats expected by the build.
          OS_PATCH_LEVEL_INPUT="${{ inputs.os_patch_level }}"
          if [[ "$OS_PATCH_LEVEL_INPUT" == lts* ]]; then
            if [[ "$OS_PATCH_LEVEL_INPUT" =~ ^lts-([0-9]{2})$ ]]; then
              OS_PATCH_LEVEL_YM="$(date -u +%Y)-${BASH_REMATCH[1]}"
            else
              OS_PATCH_LEVEL_YM="$(date -u +%Y-%m)"
            fi
          else
            OS_PATCH_LEVEL_YM="$OS_PATCH_LEVEL_INPUT"
          fi
          FIXED_BUILD_DATE="${OS_PATCH_LEVEL_YM}-05 04:20:00 UTC"
          SOURCE_DATE_EPOCH=$(date -u -d "$FIXED_BUILD_DATE" +%s)
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> $GITHUB_ENV
          KBUILD_TS=$(date -u -d @${SOURCE_DATE_EPOCH} '+%a %b %d %H:%M:%S UTC %Y')
          echo "KBUILD_BUILD_TIMESTAMP=${KBUILD_TS}" >> $GITHUB_ENV
          # Keep git metadata aligned with the same fixed timestamp.
          GIT_DATE=$(date -u -d @${SOURCE_DATE_EPOCH} '+%Y-%m-%dT%H:%M:%SZ')
          echo "GIT_COMMITTER_DATE=${GIT_DATE}" >> $GITHUB_ENV
          echo "GIT_AUTHOR_DATE=${GIT_DATE}" >> $GITHUB_ENV
          echo "Build timestamp set to: $(date -u -d @${SOURCE_DATE_EPOCH} '+%Y-%m-%d %H:%M:%S UTC') (epoch: $SOURCE_DATE_EPOCH)"

      - name: Extract Sublevel and Set File Name
        id: extract
        uses: ./.github/actions/extract-sublevel-file-name
        with:
          android_version: ${{ inputs.android_version }}
          kernel_version: ${{ inputs.kernel_version }}
          sublevel: ${{ inputs.sublevel }}
          os_patch_level: ${{ inputs.os_patch_level }}
          variant: ${{ inputs.variant }}
          page_size: ${{ inputs.page_size }}

      - name: Kernel Fixes
        uses: ./.github/actions/kernel-fixes
        with:
          version: ${{ inputs.version }}
          android_version: ${{ inputs.android_version }}
          kernel_version: ${{ inputs.kernel_version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}
          os_patch_level: ${{ inputs.os_patch_level }}

      - name: Reject KowSU with SUSFS
        if: inputs.root_flavor == 'kowsu' && (contains(inputs.feature_set, 'SUSFS') || inputs.feature_set == 'All')
        shell: bash
        run: |
          echo "ERROR: KowSU does not work together with SUSFS — re-run with SUSFS off." >&2
          exit 1

      - name: Reject FinaSU without SUSFS
        # FinaSU's kernel hard-depends on the susfs headers and its supercall
        # dispatch references susfs symbols unguarded, so a susfs-less build
        # cannot link. Unlike KernelSU/BakaSU there is no susfs-free shape.
        if: inputs.root_flavor == 'finasu' && !contains(inputs.feature_set, 'SUSFS')
        shell: bash
        run: |
          echo "ERROR: FinaSU requires SUSFS — re-run with SUSFS on." >&2
          exit 1

      - name: Setup Selected Root Implementation
        if: inputs.root_flavor != '' && inputs.root_flavor != 'none'
        uses: ./.github/actions/root-setup
        with:
          flavor: ${{ inputs.root_flavor }}
          commit: ${{ inputs.root_commit }}
          brand_name: ${{ inputs.brand_name }}

      - name: Inject custom manager signature(s) for selected root
        if: inputs.root_flavor != '' && inputs.root_flavor != 'none'
        shell: bash
        working-directory: ${{ github.workspace }}/kernel
        env:
          ROOT_FLAVOR: ${{ inputs.root_flavor }}
          SIG_KERNELSU: ${{ vars.KSU_KERNELSU_MANAGER_SIG }}
          SIG_NEXT: ${{ vars.KSU_NEXT_MANAGER_LIST }}
          SIG_BAKASU: ${{ vars.KSU_BAKASU_MANAGER_SIG }}
          SIG_SUKISU_ULTRA: ${{ vars.KSU_SUKISU_ULTRA_MANAGER_SIG }}
          SIG_KOWSU: ${{ vars.KSU_KOWSU_MANAGER_SIG }}
          SIG_FINASU: ${{ vars.KSU_FINASU_MANAGER_SIG }}
          FINASU_PRESET_MASK: ${{ vars.KSU_FINASU_PRESET_MASK }}
        run: |
          set -euo pipefail
          case "$ROOT_FLAVOR" in
            kernelsu)     SIG_LIST="$SIG_KERNELSU";;
            next)         SIG_LIST="$SIG_NEXT";;
            bakasu)       SIG_LIST="$SIG_BAKASU";;
            sukisu-ultra) SIG_LIST="$SIG_SUKISU_ULTRA";;
            kowsu)        SIG_LIST="$SIG_KOWSU";;
            finasu)       SIG_LIST="$SIG_FINASU";;
            *)            SIG_LIST="";;
          esac
          export SIG_LIST
          python3 - <<'PYEOF'
          """Inject custom KSU manager signature(s) into the selected root flavor's Kbuild/C table.

          Canonical implementation of the build.yml step body ("Inject custom manager
          signature(s) for selected root"). Generalizes main-chandr1000 commit 6ed61ad6
          (provenance: old-commit 356fac13) from KernelSU-Next-only to all six flavors.

          Inputs (via environment, never shell interpolation):
            ROOT_FLAVOR        - kernelsu | next | bakasu | sukisu-ultra | kowsu | finasu
            SIG_LIST           - entries "0x<size>:<sha256>[,...]" (size = APK v2 signing
                                 block size, sha256 = signing cert digest; exactly what
                                 .github/actions/susfs/finasu_compat/extract_manager_cert.py prints)
            FINASU_PRESET_MASK - optional 0x00..0xff preset mask for the FinaSU flavor

          Behavior per flavor (verified against the live upstream trees, 2026-10):
            kernelsu     KernelSU/kernel/Kbuild          replace KSU_EXPECTED_SIZE/HASH (?=)
            next (pershoot dev-susfs tree)               replace KSU_NEXT_MANAGER_LIST (full list)
            next (official tree)                         replace KSU_NEXT_MANAGER_SIZE/HASH (first entry)
            bakasu       BakaSU/kernel/Kbuild            insert KSU_EXPECTED_SIZE/HASH before
                                                         the "# Custom Signs" ifdef block, plus a
                                                         surgical C hoist of the Custom trust row
                                                         in kernel/manager/apk_sign.c (CI builds
                                                         set CONFIG_KSU_MULTI_MANAGER_SUPPORT=n,
                                                         which compiles out the nested row)
            sukisu-ultra Kbuild layout (main branch)     replace KSU_EXPECTED_SIZE/HASH (?=)
            sukisu-ultra builtin layout (SUSFS builds)   REPLACE the apk_sign_keys[] table
                                                         body with one row per entry -
                                                         custom-only trust, stock rows
                                                         dropped (D1a/D2a, 2026-10)
            kowsu        KowSU/kernel/Kbuild             replace KSU_EXPECTED_SIZE/HASH (?=)
            finasu       FinaSU/kernel/Kbuild            replace KSU_EXPECTED_SIZE/HASH (slot-1;
                                                         slot-2 is owned by the upstream susfs
                                                         action and must not be touched)

          Guarantees inherited from 6ed61ad6: strict input validation before anything
          reaches the compiler, exactly-one-substitution assertion, rest of file
          byte-identical, detection-based with loud warnings, post-injection report.
          """

          import os
          import re
          import sys


          def _warn(msg):
              print(f"::warning::{msg}")


          def _err(msg):
              # Workflow commands are scanned most reliably on stdout; print then exit 1
              # (equivalent to the original commit's `echo "::error::..."; exit 1`).
              print(f"::error::{msg}", flush=True)
              raise SystemExit(1)


          ENTRY_RE = r"0x[0-9a-fA-F]+:[0-9a-fA-F]{64}"

          DIRS = {
              "kernelsu": "KernelSU",
              "next": "KernelSU-Next",
              "bakasu": "BakaSU",
              "sukisu-ultra": "SukiSU-Ultra",
              "kowsu": "KowSU",
              "finasu": "FinaSU",
          }

          REPORT_FILES = {
              "kernelsu": ["KernelSU/kernel/Kbuild"],
              "next": ["KernelSU-Next/kernel/Kbuild"],
              "bakasu": ["BakaSU/kernel/Kbuild", "BakaSU/kernel/manager/apk_sign.c"],
              "sukisu-ultra": ["SukiSU-Ultra/kernel/Kbuild", "SukiSU-Ultra/kernel/manager/apk_sign.c"],
              "kowsu": ["KowSU/kernel/Kbuild"],
              "finasu": ["FinaSU/kernel/Kbuild"],
          }

          REPORT_KEYWORDS = ("MANAGER", "EXPECTED", "SIGNATURE", "PRESET")


          def read_file(path):
              with open(path, encoding="utf-8") as fh:
                  return fh.read()


          def write_file(path, content):
              with open(path, "w", encoding="utf-8") as fh:
                  fh.write(content)


          def replace_assignment(content, var, value):
              """Replace the value of the single `var :=/?= ...` assignment line."""
              return re.subn(
                  r"(?m)^(" + re.escape(var) + r"[ \t]*[:?+]?=)[ \t]*.*$",
                  lambda m: f"{m.group(1)} {value}",
                  content,
              )


          def replace_size_hash_pair(path, size_var, hash_var, size_hex, digest, label):
              """All-or-nothing single-slot override: both lines must match exactly once."""
              content = read_file(path)
              new_size, n_size = replace_assignment(content, size_var, size_hex)
              new_both, n_hash = replace_assignment(new_size, hash_var, digest)
              if n_size != 1 or n_hash != 1:
                  _warn(
                      f"{label}: expected exactly one {size_var} and one {hash_var} assignment, "
                      f"found {n_size}/{n_hash}; the Kbuild shape changed upstream - keeping defaults"
                  )
                  return False
              write_file(path, new_both)
              return True


          def first_entry(entries, label):
              """Decision D3: single-slot flavors take the first entry and warn about the rest."""
              if len(entries) > 1:
                  _warn(
                      f"{label} kernel trusts a single manager signature; using the first of "
                      f"{len(entries)} entries and ignoring the rest"
                  )
              return entries[0]


          def inject_next(kdir, raw, entries):
              kbuild = os.path.join(kdir, "kernel", "Kbuild")
              if not os.path.isfile(kbuild):
                  _err("KernelSU-Next/kernel/Kbuild not found")
              content = read_file(kbuild)
              if re.search(r"(?m)^KSU_NEXT_MANAGER_LIST[ \t]*[:?+]?=", content):
                  # pershoot dev-susfs tree (next + SUSFS): full multi-entry allowlist.
                  new_content, n = re.subn(
                      r"(?m)^KSU_NEXT_MANAGER_LIST[ \t]*[:?+]?=.*$",
                      f"KSU_NEXT_MANAGER_LIST := {raw}",
                      content,
                  )
                  if n != 1:
                      _err(f"expected exactly 1 KSU_NEXT_MANAGER_LIST assignment, found {n}")
                  write_file(kbuild, new_content)
                  return True
              if re.search(r"(?m)^KSU_NEXT_MANAGER_HASH[ \t]*[:?+]?=", content):
                  # official tree (next without SUSFS): single-hash mechanism only.
                  _warn(
                      "official KernelSU-Next tree (SUSFS off) has no manager list mechanism; "
                      "applying the first entry to its single-hash mechanism instead"
                  )
                  size_hex, digest = first_entry(entries, "KernelSU-Next (official tree)")
                  return replace_size_hash_pair(
                      kbuild, "KSU_NEXT_MANAGER_SIZE", "KSU_NEXT_MANAGER_HASH",
                      size_hex, digest, "KernelSU-Next",
                  )
              _warn("no manager hash variables found in KernelSU-Next Kbuild; skipping")
              return False


          SUKISU_TABLE_ANCHOR = "} apk_sign_keys[] = {"
          # A trust-table row line, full form: optional indentation, { size, "digest" },
          # optional trailing comma. Size in hex (0x...) or decimal (upstream's MKSU row
          # uses decimal - both must be accepted). Used with fullmatch after comment
          # stripping, so junk-prefixed rows hard-fail instead of sneaking through.
          SUKISU_ROW_RE = re.compile(r"\{ *(?:0x[0-9a-fA-F]+|[0-9]+), *\"[0-9a-fA-F]{64}\" *\},?")


          def inject_sukisu_ultra(kdir, entries):
              kbuild = os.path.join(kdir, "kernel", "Kbuild")
              cfile = os.path.join(kdir, "kernel", "manager", "apk_sign.c")
              if os.path.isfile(kbuild) and re.search(
                  r"(?m)^KSU_EXPECTED_SIZE[ \t]*[:?+]?=", read_file(kbuild)
              ):
                  # main-branch layout (SUSFS off): ordinary ?= Kbuild variables.
                  # Single slot -> first entry wins (D3).
                  size_hex, digest = first_entry(entries, "SukiSU-Ultra")
                  return replace_size_hash_pair(
                      kbuild, "KSU_EXPECTED_SIZE", "KSU_EXPECTED_HASH",
                      size_hex, digest, "SukiSU-Ultra (Kbuild layout)",
                  )
              if os.path.isfile(cfile):
                  # builtin-branch layout (SUSFS builds): hardcoded C trust table.
                  # Decisions D1(a)/D2(a) (2026-10): REPLACE the whole table body with one
                  # row per configured entry - stock rows are dropped, so only the repo
                  # variable's managers are trusted (no coexistence). is_manager_apk()
                  # accepts ANY row, so the comma-separated list is the trust list.
                  # Any upstream restructure hard-fails the build (D2a) instead of
                  # silently degrading to a wrong trust set.
                  content = read_file(cfile)
                  anchor_count = content.count(SUKISU_TABLE_ANCHOR)
                  if anchor_count != 1:
                      _err(
                          "SukiSU-Ultra builtin kernel/manager/apk_sign.c: expected exactly 1 "
                          f"trust-table anchor, found {anchor_count} (upstream restructure?)"
                      )
                  span_start = content.index(SUKISU_TABLE_ANCHOR) + len(SUKISU_TABLE_ANCHOR)
                  table_end = content.find("};", span_start)
                  if table_end < 0:
                      _err(
                          "SukiSU-Ultra builtin trust table: closing '};' not found after "
                          "anchor (upstream restructure?)"
                      )
                  # Span sanity (D2a): refuse to delete anything that is not a trust row.
                  for line in content[span_start:table_end].splitlines():
                      stripped = line.strip()
                      if not stripped or stripped.startswith("//") or stripped.startswith("/*"):
                          continue  # blank / pure comment lines carry no trust
                      code = stripped.split("//", 1)[0].strip()
                      if not SUKISU_ROW_RE.fullmatch(code):
                          _err(
                              "SukiSU-Ultra builtin trust table contains unexpected content: "
                              f"{stripped!r} - refusing to replace (upstream restructure?)"
                          )
                  rows = "\n".join(
                      f'    {{ {size_hex}, "{digest}" }}, // Custom (injected by CI)'
                      for size_hex, digest in entries
                  )
                  # Idempotent by construction: rerun produces the identical table.
                  write_file(cfile, content[:span_start] + "\n" + rows + "\n" + content[table_end:])
                  return True
              _warn("no known SukiSU-Ultra trust mechanism found (neither Kbuild variables nor builtin table); skipping")
              return False


          def inject_bakasu(kdir, entries):
              kbuild = os.path.join(kdir, "kernel", "Kbuild")
              cfile = os.path.join(kdir, "kernel", "manager", "apk_sign.c")
              if not os.path.isfile(kbuild):
                  _err("BakaSU/kernel/Kbuild not found")
              size_hex, digest = first_entry(entries, "BakaSU (custom slot)")
              content = read_file(kbuild)
              if re.search(r"(?m)^KSU_EXPECTED_SIZE[ \t]*[:?+]?=", content):
                  applied = replace_size_hash_pair(
                      kbuild, "KSU_EXPECTED_SIZE", "KSU_EXPECTED_HASH",
                      size_hex, digest, "BakaSU",
                  )
              else:
                  anchor = "# Custom Signs"
                  count = content.count(anchor)
                  if count != 1:
                      _err(f"BakaSU Kbuild: expected exactly 1 anchor '{anchor}', found {count}")
                  block = (
                      "# Custom manager signature injected by CI (repo variable)\n"
                      f"KSU_EXPECTED_SIZE := {size_hex}\n"
                      f"KSU_EXPECTED_HASH := {digest}\n"
                      "\n"
                  )
                  write_file(kbuild, content.replace(anchor, block + anchor, 1))
                  applied = True
              # Decision D4 (surgical hoist): CI builds set CONFIG_KSU_MULTI_MANAGER_SUPPORT=n,
              # which compiles out the Custom row nested inside that ifdef. Hoist a copy above
              # the ifdef so the custom certificate is actually trusted; everything else
              # (tiann/KowSU rows, multi-manager runtime) stays disabled.
              if not os.path.isfile(cfile):
                  _err("BakaSU/kernel/manager/apk_sign.c not found; cannot hoist the custom trust row")
              content = read_file(cfile)
              if "hoisted by CI injector" in content:
                  _warn("BakaSU apk_sign.c already carries the hoisted custom row; skipping")
                  return applied
              table_anchor = "static apk_sign_key_t apk_sign_keys[] = {"
              mm_ifdef = "#ifdef CONFIG_KSU_MULTI_MANAGER_SUPPORT"
              table_at = content.find(table_anchor)
              ifdef_at = content.find(mm_ifdef, table_at + 1) if table_at >= 0 else -1
              if table_at < 0 or ifdef_at < 0:
                  _err(
                      "BakaSU kernel/manager/apk_sign.c: trust-table / multi-manager anchors "
                      "not found (upstream restructure?)"
                  )
              hoist = (
                  "#ifdef EXPECTED_SIZE\n"
                  "    { EXPECTED_SIZE, EXPECTED_HASH }, // Custom (hoisted by CI injector)\n"
                  "#endif\n"
              )
              write_file(cfile, content[:ifdef_at] + hoist + content[ifdef_at:])
              return applied


          def inject_finasu(kdir, entries):
              kbuild = os.path.join(kdir, "kernel", "Kbuild")
              if not os.path.isfile(kbuild):
                  _err("FinaSU/kernel/Kbuild not found")
              # Slot-1 only: slot-2 (KSU_EXPECTED_SIZE2/HASH2) is owned by this repo's own
              # susfs action, which appends it AFTER this step and would clobber it.
              size_hex, digest = first_entry(entries, "FinaSU (trust slot 1)")
              return replace_size_hash_pair(
                  kbuild, "KSU_EXPECTED_SIZE", "KSU_EXPECTED_HASH", size_hex, digest, "FinaSU"
              )


          def inject_simple(kdir, flavor, entries):
              kbuild = os.path.join(kdir, "kernel", "Kbuild")
              if not os.path.isfile(kbuild):
                  _err(f"{kdir}/kernel/Kbuild not found")
              size_hex, digest = first_entry(entries, flavor)
              return replace_size_hash_pair(
                  kbuild, "KSU_EXPECTED_SIZE", "KSU_EXPECTED_HASH", size_hex, digest, flavor
              )


          def apply_finasu_mask(kdir, mask_raw):
              if not re.fullmatch(r"0x[0-9a-fA-F]{1,2}", mask_raw):
                  _err("KSU_FINASU_PRESET_MASK format invalid (expected 0x00..0xff)")
              kbuild = os.path.join(kdir, "kernel", "Kbuild")
              new_content, n = re.subn(
                  r"(?m)^KSU_PRESET_MANAGER_MASK[ \t]*[:?+]?=.*$",
                  f"KSU_PRESET_MANAGER_MASK := {mask_raw}",
                  read_file(kbuild),
              )
              if n != 1:
                  _warn("KSU_PRESET_MANAGER_MASK not found in FinaSU Kbuild; mask not applied")
                  return
              write_file(kbuild, new_content)
              print(f"FinaSU preset manager mask set to {mask_raw}")


          def report(flavor):
              print(f"Manager signature injection for '{flavor}': see matched lines below")
              for rel in REPORT_FILES[flavor]:
                  if not os.path.isfile(rel):
                      continue
                  for line in read_file(rel).splitlines():
                      stripped = line.strip()
                      if stripped.startswith("KSU_") and any(k in stripped for k in REPORT_KEYWORDS):
                          print(f"{rel}: {stripped}")
                      elif stripped.startswith("ccflags-y") and "EXPECTED" in stripped:
                          print(f"{rel}: {stripped}")
                      elif "injected by CI" in stripped:
                          print(f"{rel}: {stripped}")


          def main():
              flavor = os.environ.get("ROOT_FLAVOR", "")
              raw = (os.environ.get("SIG_LIST") or "").strip()
              mask_raw = (os.environ.get("FINASU_PRESET_MASK") or "").strip()

              kdir = DIRS.get(flavor)
              if kdir is None:
                  _warn(f"no manager-signature mapping for flavor '{flavor}'; skipping")
                  return
              if not os.path.isdir(kdir):
                  _err(f"{kdir}/ not found - was Setup Selected Root Implementation skipped?")

              entries = []
              if raw:
                  if not re.fullmatch(ENTRY_RE + r"(," + ENTRY_RE + r")*", raw):
                      _err("manager signature list format invalid (expected 0x<size>:<sha256>[,...])")
                  entries = [tuple(entry.split(":", 1)) for entry in raw.split(",")]

              applied = False
              if not raw:
                  _warn(f"manager signature variable for flavor '{flavor}' is empty; using Kbuild defaults")
              elif flavor == "next":
                  applied = inject_next(kdir, raw, entries)
              elif flavor == "sukisu-ultra":
                  applied = inject_sukisu_ultra(kdir, entries)
              elif flavor == "bakasu":
                  applied = inject_bakasu(kdir, entries)
              elif flavor == "finasu":
                  applied = inject_finasu(kdir, entries)
              else:
                  applied = inject_simple(kdir, flavor, entries)

              if flavor == "finasu" and mask_raw:
                  apply_finasu_mask(kdir, mask_raw)

              print(f"Manager signature injection for '{flavor}': {'applied' if applied else 'no changes'}")
              report(flavor)


          main()
          PYEOF

      - name: Mark No Root build metadata
        if: inputs.root_flavor == 'none'
        shell: bash
        env:
          BRAND_RAW: ${{ inputs.brand_name }}
        run: |
          BRAND="$(printf '%s' "$BRAND_RAW" | tr '[:upper:]' '[:lower:]')"
          printf '%s' "$BRAND" | grep -Eq '^[a-z0-9_.-]{1,32}$' || BRAND="wild"
          {
            echo "ROOT_IMPLEMENTATION=none"
            echo "ROOT_MANAGER=N/A"
            echo "ROOT_VERSION=N/A"
            echo "ROOT_COMMIT=N/A"
            # No root: branding falls back to the kernel source's own git HEAD
            # for uname -r; uname -v still carries the (custom) brand.
            echo "WILD_KSU_COMMIT="
            echo "WILD_BUILD_USER=$BRAND"
            echo "WILD_BUILD_HOST="
            echo "WILD_KSU_FORK=none"
          } >> "$GITHUB_ENV"

      - name: Disable SUSFS for BakaSU without SUSFS feature
        if: inputs.root_flavor == 'bakasu' && !contains(inputs.feature_set, 'SUSFS')
        uses: ./.github/actions/set-kernel-config
        with:
          config_list: |
            CONFIG_KSU_SUSFS=n
            CONFIG_KSU_SUSFS_SUS_PATH=n
            CONFIG_KSU_SUSFS_SUS_MOUNT=n
            CONFIG_KSU_SUSFS_SUS_KSTAT=n
            CONFIG_KSU_SUSFS_SPOOF_UNAME=n
            CONFIG_KSU_SUSFS_ENABLE_LOG=n
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=n
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=n
            CONFIG_KSU_SUSFS_OPEN_REDIRECT=n
            CONFIG_KSU_SUSFS_SUS_MAP=n

      - name: Disable SUSFS for SukiSU-Ultra without SUSFS feature
        if: inputs.root_flavor == 'sukisu-ultra' && !contains(inputs.feature_set, 'SUSFS')
        uses: ./.github/actions/set-kernel-config
        with:
          config_list: |
            CONFIG_KSU_SUSFS=n
            CONFIG_KSU_SUSFS_SUS_PATH=n
            CONFIG_KSU_SUSFS_SUS_MOUNT=n
            CONFIG_KSU_SUSFS_SUS_KSTAT=n
            CONFIG_KSU_SUSFS_SPOOF_UNAME=n
            CONFIG_KSU_SUSFS_ENABLE_LOG=n
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=n
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=n
            CONFIG_KSU_SUSFS_OPEN_REDIRECT=n
            CONFIG_KSU_SUSFS_SUS_MAP=n

      - name: SUSFS
        # One step, one action: resolve the SUSFS commit, apply it for the
        # selected root, then run the post-patch fixes (ksu_close_fd restore,
        # selinux_hide 6.6+ shim). All of that lives in
        # .github/actions/susfs/action.yml - the workflow no longer carries
        # SUSFS shell code.
        uses: ./.github/actions/susfs
        with:
          enabled: ${{ contains(inputs.feature_set, 'SUSFS') || inputs.feature_set == 'All' }}
          susfs_commit: ${{ inputs.susfs_commit }}
          version: ${{ inputs.version }}
          android_version: ${{ inputs.android_version }}
          kernel_version: ${{ inputs.kernel_version }}
          os_patch_level: ${{ inputs.os_patch_level }}
          sublevel: ${{ steps.extract.outputs.sublevel }}
          root_flavor: ${{ inputs.root_flavor }}

      - name: Baseband Guard
        if: (contains(inputs.feature_set, 'BBG') || inputs.feature_set == 'All')
        uses: ./.github/actions/bbg

      - name: Setup Networking
        if: contains(inputs.feature_set, 'NET') || inputs.feature_set == 'All'
        uses: ./.github/actions/networking
        with:
          os_patch_level: ${{ inputs.os_patch_level }}
          version: ${{ inputs.version }}
          kernel_version: ${{ inputs.kernel_version }}
          android_version: ${{ inputs.android_version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}

      - name: DroidSpaces-OSS Patches
        if: contains(inputs.feature_set, 'DS') || inputs.feature_set == 'All'
        uses: ./.github/actions/droidspaces
        with:
          version: ${{ inputs.version }}
          android_version: ${{ inputs.android_version }}
          kernel_version: ${{ inputs.kernel_version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}
          os_patch_level: ${{ inputs.os_patch_level }}
          droidspaces_commit: ${{ inputs.droidspaces_commit }}

      - name: Apply NTSync Patches
        if: contains(inputs.feature_set, 'NTSync')
        uses: ./.github/actions/ntsync
        with:
          version: ${{ inputs.version }}
          kernel_version: ${{ inputs.kernel_version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}

      - name: Apply Ptrace Patch
        if: contains(inputs.feature_set, 'Ptrace')
        uses: ./.github/actions/ptrace
        with:
          kernel_version: ${{ inputs.kernel_version }}

      - name: Apply Unicode Fix Patch
        if: contains(inputs.feature_set, 'Unicode')
        uses: ./.github/actions/unicode-fix
        with:
          kernel_version: ${{ inputs.kernel_version }}

      - name: Apply Performance Patches
        uses: ./.github/actions/performance
        if: contains(inputs.feature_set, 'Perf')
        with:
          kernel_version: ${{ inputs.kernel_version }}

      - name: Setup Misc Configs
        uses: ./.github/actions/misc
        with:
          version: ${{ inputs.version }}
          kernel_version: ${{ inputs.kernel_version }}
          android_version: ${{ inputs.android_version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}
          variant: ${{ inputs.variant }}

      - name: Enable BPF Stack (BTF + eBPF + FUSE-BPF)
        if: contains(inputs.feature_set, 'BPF')
        uses: ./.github/actions/btf
        with:
          version: ${{ inputs.version }}
          kernel_version: ${{ inputs.kernel_version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}

      - name: Apply Device-Specific Patches
        uses: ./.github/actions/apply-device-patches
        with:
          version: ${{ inputs.version }}
          kernel_version: ${{ inputs.kernel_version }}

      - name: Integrate NoMount
        if: contains(inputs.feature_set, 'NoMount') || inputs.feature_set == 'All'
        uses: ./.github/actions/nomount
        with:
          commit: ${{ inputs.nomount_commit }}
          kernel_version: ${{ inputs.kernel_version }}

      - name: Apply Kernel Branding
        uses: ./.github/actions/apply-kernel-branding
        with:
          variant: ${{ inputs.variant }}
          kernel_version: ${{ inputs.kernel_version }}
          android_version: ${{ inputs.android_version }}
          version: ${{ inputs.version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}
          brand_name: ${{ inputs.brand_name }}
          keep_kmi: ${{ inputs.keep_kmi }}
          ksu_commit: ${{ env.WILD_KSU_COMMIT }}
          kbuild_build_host: ${{ env.WILD_BUILD_HOST }}
          kbuild_build_user: ${{ env.WILD_BUILD_USER }}

      - name: Remove Protected Exports
        uses: ./.github/actions/remove-protected-exports

      - name: Clean Kernel Flags
        uses: ./.github/actions/clean-kernel-flags

      - name: Scan and collect patch rejects
        id: scan
        if: always()
        uses: ./.github/actions/scan-patch-rejects

      - name: Upload Rejects
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.extract.outputs.file_name }}-Rejects
          path: patch-rejects/
          if-no-files-found: ignore
          compression-level: 9

      - name: "Setup Cache and Build Environment"
        if: inputs.use_cache
        uses: ./.github/actions/cache-setup
        with:
          version: ${{ inputs.version }}
          android_version: ${{ inputs.android_version }}
          kernel_version: ${{ inputs.kernel_version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}

      - name: Restore ccache
        id: restore-ccache
        continue-on-error: true
        if: inputs.use_cache && (inputs.version == 'android12-5.10' || inputs.version == 'android13-5.10' || inputs.version == 'android13-5.15')
        uses: ./.github/actions/cache-restore
        with:
          cache_path: /home/runner/.ccache
          cache_key: ${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ steps.extract.outputs.sublevel }}-${{ inputs.os_patch_level }}-${{ inputs.variant }}
          cache_bucket: ccache-cache-${{ inputs.version }}-${{ inputs.variant }}
          restore_keys: |
            ${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ steps.extract.outputs.sublevel }}-

      - name: Restore bazel-cache
        id: restore-bazel
        continue-on-error: true
        if: inputs.use_cache && (inputs.version == 'android14-5.15' || inputs.version == 'android14-6.1' || inputs.version == 'android15-6.6' || inputs.version == 'android16-6.12')
        uses: ./.github/actions/cache-restore
        with:
          cache_path: /home/runner/.cache/bazel
          cache_key: ${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ steps.extract.outputs.sublevel }}-${{ inputs.os_patch_level }}-${{ inputs.variant }}${{ inputs.page_size == '16k' && '-16k' || '' }}
          cache_bucket: bazel-cache-${{ inputs.version }}-${{ inputs.variant }}${{ inputs.page_size == '16k' && '-16k' || '' }}
          restore_keys: |
            ${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ steps.extract.outputs.sublevel }}-

      - name: Check cache hit
        run: |
          echo "Cache restore status:"
          CCACHE_HIT="${{ steps.restore-ccache.outputs.cache-hit || 'skipped' }}"
          BAZEL_HIT="${{ steps.restore-bazel.outputs.cache-hit || 'skipped' }}"
          echo "  ccache: $CCACHE_HIT"
          echo "  bazel: $BAZEL_HIT"

      - name: Get Cache Stats
        uses: ./.github/actions/cache-stats
        with:
          clear_stats: true

      - name: Initialize Config Fragment
        run: touch "${{ github.workspace }}/wild_gki.fragment"

      - name: Apply Kernel Bypass Hack
        if: ${{ inputs.allow_version_mismatch == 'true' }}
        uses: ./.github/actions/bypass-kernel
        with:
          version: ${{ inputs.version }}
          allow_version_mismatch: true

      - name: Build Normal Kernel
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
          KBUILD_BUILD_TIMESTAMP: ${{ env.KBUILD_BUILD_TIMESTAMP }}
          KBUILD_BUILD_USER: ${{ env.WILD_BUILD_USER != '' && env.WILD_BUILD_USER || ((inputs.version == 'android15-6.6' || inputs.version == 'android16-6.12') && 'kleaf' || 'build-user') }}
          KBUILD_BUILD_HOST: ${{ env.WILD_BUILD_HOST != '' && env.WILD_BUILD_HOST || 'build-host' }}
        uses: ./.github/actions/build-kernel
        with:
          version: ${{ inputs.version }}
          page_size: ${{ inputs.page_size }}
          kbuild_build_user: ${{ env.WILD_BUILD_USER }}
          kbuild_build_host: ${{ env.WILD_BUILD_HOST }}

      - name: Get Cache Stats
        uses: ./.github/actions/cache-stats
        with:
          clear_stats: false

      - name: Prune ccache before save
        if: always() && inputs.use_cache && (inputs.version == 'android12-5.10' || inputs.version == 'android13-5.10' || inputs.version == 'android13-5.15')
        shell: bash
        run: |
          if [ -d /home/runner/.ccache ]; then
            ccache -c 2>/dev/null || true
            find /home/runner/.ccache -type f -mtime +0.5 -delete 2>/dev/null || true
            find /home/runner/.ccache -type d -empty -delete 2>/dev/null || true
            echo "ccache pruned"; ccache -s 2>/dev/null | head -20 || true
          fi

      - name: Save ccache
        continue-on-error: true
        uses: ./.github/actions/cache-save
        if: always() && inputs.use_cache && (inputs.version == 'android12-5.10' || inputs.version == 'android13-5.10' || inputs.version == 'android13-5.15')
        with:
          cache_path: /home/runner/.ccache
          cache_key: ${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ steps.extract.outputs.sublevel }}-${{ inputs.os_patch_level }}-${{ inputs.variant }}
          cache_bucket: "ccache-cache-${{ inputs.version }}-${{ inputs.variant }}"
          compression_level: 9
          github_token: ${{ github.token }}

      - name: Save bazel-cache
        continue-on-error: true
        uses: ./.github/actions/cache-save
        if: always() && inputs.use_cache && (inputs.version == 'android14-5.15' || inputs.version == 'android14-6.1' || inputs.version == 'android15-6.6' || inputs.version == 'android16-6.12')
        with:
          cache_path: /home/runner/.cache/bazel
          cache_key: ${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ steps.extract.outputs.sublevel }}-${{ inputs.os_patch_level }}-${{ inputs.variant }}${{ inputs.page_size == '16k' && '-16k' || '' }}
          cache_bucket: "bazel-cache-${{ inputs.version }}-${{ inputs.variant }}${{ inputs.page_size == '16k' && '-16k' || '' }}"
          compression_level: 9
          github_token: ${{ github.token }}

      - name: Consolidated Build Summary
        id: build-summary
        if: always()
        uses: ./.github/actions/build-summary
        with:
          job_status: ${{ job.status }}
          file_name: ${{ steps.extract.outputs.file_name }}
          kernel_version: ${{ inputs.kernel_version }}
          sublevel: ${{ inputs.sublevel }}
          android_version: ${{ inputs.android_version }}
          os_patch_level: ${{ inputs.os_patch_level }}
          variant: ${{ inputs.variant }}
          page_size: ${{ inputs.page_size }}
          feature_set: ${{ inputs.feature_set }}
          nomount_commit: ${{ inputs.nomount_commit }}
          susfs_commit: ${{ inputs.susfs_commit }}

      - name: Upload Artifacts
        id: kernel-artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.extract.outputs.file_name }}-AnyKernel3
          path: ${{ github.workspace }}/AnyKernel3/**
          if-no-files-found: ignore
          compression-level: 9

      - name: Write Build-verified only artifact metadata
        if: success() && inputs.root_flavor != '' && inputs.root_flavor != 'none'
        uses: ./.github/actions/build-metadata
        with:
          summary_base: ${{ steps.build-summary.outputs.summary_base }}
          file_name: ${{ steps.extract.outputs.file_name }}
          feature_set: ${{ inputs.feature_set }}
          nomount_commit: ${{ inputs.nomount_commit }}
          android_version: ${{ inputs.android_version }}
          kernel_version: ${{ inputs.kernel_version }}
          os_patch_level: ${{ inputs.os_patch_level }}
          page_size: ${{ inputs.page_size }}

      - name: Upload Build Summary + Metadata
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.extract.outputs.file_name }}-BuildInfo
          path: /tmp/build-summary-${{ steps.build-summary.outputs.summary_base }}.md
          if-no-files-found: warn
          compression-level: 9
