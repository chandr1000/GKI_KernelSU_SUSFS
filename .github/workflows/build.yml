name: Kernel Build Process
permissions:
  contents: write
  actions: write

env:
  # D20 diagnostics gate (plan v3.0.0 §3.8): the ci(diagnostics) layer in the
  # build-kernel action plus the digest / log-artifact steps below are opt-in,
  # driven by GitHub's debug toggle ACTIONS_RUNNER_DEBUG (repo secret or
  # variable, Settings -> Secrets and variables -> Actions, value 'true').
  # GitHub's own precedence applies: when both exist the secret wins.
  # false/unset/anything else = OFF = baseline build semantics, untouched.
  CI_DIAGNOSTICS: ${{ (secrets.ACTIONS_RUNNER_DEBUG != '' && secrets.ACTIONS_RUNNER_DEBUG == 'true') || (secrets.ACTIONS_RUNNER_DEBUG == '' && vars.ACTIONS_RUNNER_DEBUG == 'true') }}

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      sublevel:
        required: true
        type: string
      os_patch_level:
        required: true
        type: string
      runner:
        description: 'Runner image label (ubuntu-24.04 or ubuntu-latest); lets a single leg be A/B tested'
        required: false
        type: string
        default: 'ubuntu-24.04'
      variant:
        required: false
        type: string
      feature_set:
        required: true
        type: string
      ksu_branch:
        required: false
        type: string
        default: ""
      susfs_commit:
        required: false
        type: string
        default: ""
      root_flavor:
        required: false
        type: string
        default: ""
      root_commit:
        required: false
        type: string
        default: ""
      nomount_commit:
        required: false
        type: string
        default: ""
      kernel_patches_commit:
        required: false
        type: string
        default: ""
      anykernel3_commit:
        required: false
        type: string
        default: ""
      droidspaces_commit:
        required: false
        type: string
        default: ""
      brand_name:
        required: false
        type: string
        default: Wild
      keep_kmi:
        required: false
        type: boolean
        default: false
      allow_version_mismatch:
        required: false
        type: boolean
        default: false
      use_cache:
        description: "Enable ccache/bazel cache (restore/save via release buckets)"
        required: false
        type: boolean
        default: false
      page_size:
        description: "ARM64 page size: 4k (default) or 16k (Kleaf --page_size)"
        required: false
        type: string
        default: "4k"
      # 25-input consolidation: merged from google_backport (bool) +
      # google_backport_ref (string); semantics preserved.
      google_backport:
        description: "Google upstream backport series, android15-6.6 legs: off = skip | auto = auto-detect the gki<V><P><sublevel> branch for this leg | branch/tag/SHA = pin an exact series state for reproducible builds"
        required: false
        type: string
        default: "off"
      stock_config_artifact:
        description: "Artifact name with prefetched stock configs (stock_<kver>[_16k].config)"
        required: false
        type: string
        default: ""
      abi_gate:
        description: "ABI gate (plan v2.2.0 §12): warn = report deltas, never block | enforce = fail on existing-symbol CRC delta vs this run's pristine baseline | +fail-new suffix = also fail on new exported symbols (D9) | off = skip baseline build + gate (single build, zero overhead)"
        required: false
        type: string
        default: "warn"
      features:
        description: "Feature-patches applier: default (manifest enabled decides) | off | comma-list of ids to force-enable (plan v3.0.0 SS3.5)"
        required: false
        type: string
        default: "default"
      patches_ref:
        description: "feature-patches content ref: branch or pinned SHA (reproducibility pin)"
        required: false
        type: string
        default: "feature/patches"

jobs:
  build-gki:
    name: "${{ inputs.kernel_version }}.${{ inputs.sublevel }}-${{ inputs.android_version }}-${{ inputs.os_patch_level }} (${{ inputs.variant }})"
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 120
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Download Prefetched Stock Configs
        if: inputs.stock_config_artifact != ''
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.stock_config_artifact }}
          path: stock-configs

      - name: Validate Page Size
        shell: bash
        run: |
          set -euo pipefail
          PAGE_SIZE="${{ inputs.page_size }}"
          case "$PAGE_SIZE" in
            4k) exit 0 ;;
            16k) ;;
            *) echo "ERROR: unsupported page_size '$PAGE_SIZE' (expected 4k or 16k)." >&2; exit 1 ;;
          esac
          # Kleaf exposes --page_size only on the build branches used by these
          # GKI families (main-kernel-build-2023/2024, main-kernel-2025).
          case "${{ inputs.version }}" in
            android14-6.1|android15-6.6|android16-6.12) ;;
            *)
              echo "ERROR: page_size=16k is not supported for ${{ inputs.version }}." >&2
              echo "Supported families: android14-6.1, android15-6.6, android16-6.12." >&2
              exit 1
              ;;
          esac

      - name: Emergency Disk Cleanup
        if: false
        uses: ./.github/actions/disk-cleanup

      - name: Free Disk Space
        if: true
        uses: endersonmenezes/free-disk-space@v4 # Use @main for latest, @v3 for stable
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz" # Use 'rmz' for faster deletion (default: 'rm')
          rmz_version: "3.2.0" # Required when rm_cmd is 'rmz'
          testing: false

      - name: Setup more Swap (for LTO)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment
        with:
          version: ${{ inputs.version }}
          sublevel: ${{ inputs.sublevel }}
          kernel_patches_commit: ${{ inputs.kernel_patches_commit }}
          anykernel3_commit: ${{ inputs.anykernel3_commit }}

      - name: Download Kernel Repository
        uses: ./.github/actions/download-kernel
        with:
          version: ${{ inputs.version }}
          android_version: ${{ inputs.android_version }}
          kernel_version: ${{ inputs.kernel_version }}
          os_patch_level: ${{ inputs.os_patch_level }}

      - name: Apply Google Upstream Backport Series (auto-detected gki<sublevel>)
        id: google-backport
        if: inputs.google_backport && inputs.google_backport != 'off' && inputs.version == 'android15-6.6'
        shell: bash
        run: |
          set -euo pipefail
          GBP_TREE="${{ github.workspace }}/kernel/common"
          GBP_VERSION="${{ inputs.version }}"
          GBP_INPUT="${{ inputs.google_backport }}"          # raw toggle input (provenance)
          # C2 (plan §4): "started" marker sidecar — if this step dies at any
          # gate below (F11/F13/F2/F3/F4/F6b or the apply itself), the
          # build-summary renderer (C3) reports "failed before apply" instead
          # of silently showing "not requested". Every terminal state below
          # overwrites this file.
          export GBP_VERSION GBP_INPUT
          python3 - <<'GBP_STATE_PY'
          import json, os
          json.dump({"schema": "google-backport-series/v1", "state": "started",
                     "leg": os.environ["GBP_VERSION"],
                     "input": os.environ["GBP_INPUT"]},
                    open("/tmp/google-backport-series.json", "w"))
          GBP_STATE_PY
          # family prefix <V><P> + dotted family, derived from the leg's kernel
          # version (android15-6.6 -> 66 / 6.6). Family-agnostic by design: a
          # new family needs threading + self-gate changes only (OQ-1).
          GBP_VP="$(sed 's/^android15-//; s/\.//' <<<"$GBP_VERSION")"
          GBP_KFAM="${GBP_VERSION#*-}"
          GBP_GKI_RE="^gki${GBP_VP}([0-9]+)$"
          GBP_TAG_RE="^${GBP_KFAM//./\\.}\.([0-9]+)-backport-"

          # --- Stage 1: ref resolution (auto is the default; explicit pins) ---
          GBP_REF="${{ inputs.google_backport }}"
          GBP_REF_MODE=explicit
          GBP_CANDIDATES=""
          if [[ -z "$GBP_REF" || "$GBP_REF" == "auto" ]]; then
            GBP_REF_MODE=auto
            # naming contract: gki + digits ONLY, full match — gki-wip /
            # gki_debug / gki6677test / gki6677-old can never match.
            mapfile -t CANDS < <(git ls-remote --heads \
                "${{ github.server_url }}/${{ github.repository }}" \
                | awk '{print $2}' | sed 's|^refs/heads/||' \
                | grep -E '^gki[0-9]+$' | sort)
            if (( ${#CANDS[@]} == 0 )); then
              echo "ERROR: no gki<digits> series branch found in ${{ github.repository }} (google_backport is ON)" >&2
              exit 1                                                    # F11
            fi
            GBP_CANDIDATES="${CANDS[*]}"
            WANT="gki${GBP_VP}${{ inputs.sublevel }}"                   # gki<V><P><sublevel> (today: gki66<sublevel>)
            if printf '%s\n' "${CANDS[@]}" | grep -qx "$WANT"; then
              GBP_REF="$WANT"
            else
              # F12: series not (yet) authored for this leg — skip, matrix continues
              echo "GBP_STATE=skipped-no-series-branch" >> "$GITHUB_ENV"
              # C2 (plan §4/D4): terminal skip-state sidecar — the renderer
              # reports the skip with candidates, never a patch list.
              export GBP_WANT="$WANT" GBP_CANDIDATES
              # NOTE: the heredoc body + terminator sit at the step's base
              # indent on purpose — bash requires the closing delimiter at
              # column 0 (post-YAML-strip), so it cannot nest inside this
              # else-block like the python3 line does.
              python3 - <<'GBP_SKIP_PY'
          import json, os
          json.dump({
              "schema": "google-backport-series/v1",
              "state": "skipped-no-series-branch",
              "leg": os.environ["GBP_VERSION"],
              "input": os.environ["GBP_INPUT"],
              "wanted_branch": os.environ["GBP_WANT"],
              "candidates": os.environ.get("GBP_CANDIDATES", "").split(),
          }, open("/tmp/google-backport-series.json", "w"), indent=2)
          GBP_SKIP_PY
              {
                echo "### Google upstream backport series"
                echo "- State: skipped — no series branch \`${WANT}\` for this leg (auto mode)"
                echo "- gki<digits> branches seen: ${GBP_CANDIDATES:-none}"
              } >> "$GITHUB_STEP_SUMMARY"
              echo "Series branch ${WANT} not found for this leg; gki branches seen: ${GBP_CANDIDATES:-none}. Skipping."
              exit 0
            fi
          fi
          [[ "$GBP_REF" =~ ^[A-Za-z0-9._/-]+$ && "$GBP_REF" != *..* ]] || { echo "ERROR: illegal ref: ${GBP_REF}" >&2; exit 1; }

          # --- Stage 2: fetch the series tree (branch, tag and SHA all resolve
          #     through this one path; GitHub serves raw-SHA fetches) ---------
          git init -q "${{ github.workspace }}/series-src"
          git -C "${{ github.workspace }}/series-src" fetch --depth=1 \
              "${{ github.server_url }}/${{ github.repository }}" "$GBP_REF"
          git -C "${{ github.workspace }}/series-src" checkout -q FETCH_HEAD
          GBP_REF_HEAD="$(git -C "${{ github.workspace }}/series-src" rev-parse FETCH_HEAD)"

          # --- Stage 3: series-root discovery by content (F13). Never derive
          #     paths from the ref name — an explicit tag/SHA resolves to the
          #     same tree under the branch-named directory. -------------------
          mapfile -t ROOTS < <(find "${{ github.workspace }}/series-src" -mindepth 2 -maxdepth 2 \
                               -name series.conf | sort)
          if (( ${#ROOTS[@]} != 1 )); then
            echo "ERROR: expected exactly one series.conf under series-src, found ${#ROOTS[@]}: ${ROOTS[*]:-none}" >&2
            exit 1                                                      # F13
          fi
          GBP_SERIES_ROOT="${ROOTS[0]%/*}"
          GBP_SERIES_CONF="${GBP_SERIES_ROOT}/series.conf"

          # --- expected sublevel from the resolved ref (§2.2 of the wild doc):
          #     auto -> leg sublevel; gki<V><P><n> / <V>.<P>.<n>-backport- tags
          #     -> captured n; anything else -> leg sublevel + warning.
          #     A gki<digits> ref from ANOTHER family is rejected outright —
          #     sublevel and family mismatches are structurally impossible. ---
          GBP_EXPECTED_SUBLEVEL="${{ inputs.sublevel }}"
          if [[ "$GBP_REF_MODE" == explicit ]]; then
            if [[ "$GBP_REF" =~ $GBP_GKI_RE ]]; then
              GBP_EXPECTED_SUBLEVEL="${BASH_REMATCH[1]}"
            elif [[ "$GBP_REF" =~ ^gki([0-9]+)$ ]]; then
              echo "ERROR: series ref ${GBP_REF} belongs to a different kernel family than this ${GBP_KFAM} leg (this leg takes gki${GBP_VP}<sublevel> or ${GBP_KFAM}.<n>-backport-* refs)" >&2
              exit 1                                                    # F6b (family)
            elif [[ "$GBP_REF" =~ $GBP_TAG_RE ]]; then
              GBP_EXPECTED_SUBLEVEL="${BASH_REMATCH[1]}"
            else
              echo "WARNING: ref ${GBP_REF} matches neither gki<V><P><sublevel> nor ${GBP_KFAM}.<n>-backport-*; the generation gate assumes this leg's sublevel (${{ inputs.sublevel }})" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          # --- Makefile generation gate (F6b: sublevel AND family) -----------
          GBP_MK="${GBP_TREE}/Makefile"
          MK_VERSION="$(sed -n 's/^VERSION[[:space:]]*=[[:space:]]*\([0-9]\{1,\}\).*/\1/p' "$GBP_MK" | head -1)"
          MK_PATCHLEVEL="$(sed -n 's/^PATCHLEVEL[[:space:]]*=[[:space:]]*\([0-9]\{1,\}\).*/\1/p' "$GBP_MK" | head -1)"
          MK_SUBLEVEL="$(sed -n 's/^SUBLEVEL[[:space:]]*=[[:space:]]*\([0-9]\{1,\}\).*/\1/p' "$GBP_MK" | head -1)"
          if [[ -z "$MK_VERSION" || -z "$MK_PATCHLEVEL" || -z "$MK_SUBLEVEL" ]]; then
            echo "ERROR: cannot parse VERSION/PATCHLEVEL/SUBLEVEL from ${GBP_MK}" >&2
            exit 1
          fi
          if [[ "$MK_VERSION" != "${GBP_KFAM%%.*}" || "$MK_PATCHLEVEL" != "${GBP_KFAM##*.}" || "$MK_SUBLEVEL" != "$GBP_EXPECTED_SUBLEVEL" ]]; then
            echo "ERROR: series base mismatch (expected ${GBP_KFAM}.${GBP_EXPECTED_SUBLEVEL} tree, found ${MK_VERSION}.${MK_PATCHLEVEL}.${MK_SUBLEVEL})" >&2
            exit 1                                                      # F6b
          fi

          # --- pre-flight scan: manifest, existence, numbering (fail before
          #     any kernel-tree mutation) --------------------------------------
          mapfile -t ENTRIES < <(grep -vE '^[[:space:]]*(#|$)' "$GBP_SERIES_CONF")
          GBP_COUNT="${#ENTRIES[@]}"
          if (( GBP_COUNT == 0 )); then
            echo "ERROR: series.conf has zero entries: ${GBP_SERIES_CONF}" >&2
            exit 1                                                      # F2
          fi
          log() { echo "[google-backport] $*"; }
          log "series: ${GBP_SERIES_CONF} — ${GBP_COUNT} patch(es) (ref ${GBP_REF}, mode ${GBP_REF_MODE})"
          MISSING=()
          BADNUM=()
          GAPS=()
          PREV=0
          for i in "${!ENTRIES[@]}"; do
            entry="${ENTRIES[$i]}"
            if [[ ! -f "${GBP_SERIES_ROOT}/patches/${entry}" ]]; then
              MISSING+=("entry $((i+1)): ${entry}")
            fi
            if [[ "$entry" =~ ^([0-9]+)- ]]; then
              num="$((10#${BASH_REMATCH[1]}))"
              if (( num <= PREV )); then
                BADNUM+=("entry $((i+1)): ${entry} (not strictly increasing; previous prefix $(printf '%04d' "$PREV"))")
              fi
              if (( PREV > 0 && num > PREV + 1 )); then
                GAPS+=("$(printf '%04d' "$PREV") -> $(printf '%04d' "$num")")
              fi
              PREV=$num
            else
              BADNUM+=("entry $((i+1)): ${entry} (no NNNN- number prefix)")
            fi
          done
          if (( ${#MISSING[@]} > 0 )); then
            echo "ERROR: ${#MISSING[@]} series entry file(s) missing from ${GBP_SERIES_ROOT}/patches/:" >&2
            printf '  %s\n' "${MISSING[@]}" >&2
            exit 1                                                      # F3 (complete list, not first-miss-only)
          fi
          if (( ${#BADNUM[@]} > 0 )); then
            echo "ERROR: series numbering corrupted:" >&2
            printf '  %s\n' "${BADNUM[@]}" >&2
            exit 1                                                      # F4
          fi
          if (( ${#GAPS[@]} > 0 )); then
            echo "WARNING: series numbering has ${#GAPS[@]} gap(s): ${GAPS[*]} (expected only after enable-revert row removal, §3.4-pt-5)" >> "$GITHUB_STEP_SUMMARY"
          fi

          # --- apply (the series' own apply-series.sh — zero application-logic
          #     drift from Track A; strict git apply, no --3way) ---------------
          log "applying onto ${GBP_TREE}"
          KERNEL_DIR="$GBP_TREE" \
            bash "${GBP_SERIES_ROOT}/scripts/apply-series.sh" \
            "$GBP_SERIES_CONF"

          # --- provenance (§2.5) ----------------------------------------------
          GBP_SERIES_SHA="$(sha256sum "$GBP_SERIES_CONF" | cut -c1-12)"

          # --- C2 (plan §4, D2 taxonomy): dynamic batch/entry listing for the
          #     build-summary renderer. Grouping rule: ONLY comments matching
          #     "^Batch <id>" start a group; every other comment (CVE
          #     annotations, the 0077-0081 removal note, header prose) is an
          #     annotation — entries keep flowing into the current group.
          #     Categories are attached at run time by classify() — the ONE
          #     place the D2 taxonomy lives; unknown future batches (the 6.6
          #     LTS catch-up era, D7) land in "other" with their raw label
          #     preserved. Generated at run time, never maintained by hand.
          export GBP_VERSION GBP_INPUT GBP_REF_MODE GBP_REF GBP_REF_HEAD \
                 GBP_SERIES_SHA GBP_COUNT GBP_CANDIDATES
          python3 - "$GBP_SERIES_CONF" > /tmp/gbp-batches.json <<'GBP_BATCH_PY'
          import json, re, sys

          def classify(label):   # D2 mapping — the ONE place the taxonomy lives
              L = label.lower()
              if re.match(r'^batch a\b', L) or 'security' in L or 'asb' in L or 'cve' in L:
                  return "security"       # Security backports (ASB/CVE) — Batch A
              if re.match(r'^batch b', L) or 'stability' in L or 'bugfix' in L or 'bug fix' in L:
                  return "stability"      # Stability & bug fixes (B-1..B-3 combined, D2)
              if 'maintenance' in L or 'cleanup' in L or 'tooling' in L or 'revert' in L:
                  return "maintenance"    # Maintenance & cleanups
              return "other"              # Other — <raw label> (D7 LTS catch-up safety)

          batches = []
          for line in open(sys.argv[1]):
              s = line.strip()
              if not s:
                  continue
              if s.startswith("#"):
                  txt = s.lstrip("#").strip()
                  if re.match(r'^Batch\s+\S', txt, re.I):
                      batches.append({"label": txt, "entries": [],
                                      "category": classify(txt)})
                  continue
              if not batches:
                  batches.append({"label": "(pre-batch)", "entries": [],
                                  "category": "other"})
              batches[-1]["entries"].append(s)

          json.dump(batches, sys.stdout)
          GBP_BATCH_PY

          python3 - <<'GBP_ASSEMBLE_PY'
          import json, os
          batches = json.load(open("/tmp/gbp-batches.json"))
          counts = {}                       # D2: canonical category counts (computed)
          for b in batches:
              counts[b["category"]] = counts.get(b["category"], 0) + len(b["entries"])
          doc = {
            "schema": "google-backport-series/v1",
            "state": "applied",
            "leg": os.environ["GBP_VERSION"],
            "input": os.environ["GBP_INPUT"],
            "mode": os.environ["GBP_REF_MODE"],
            "ref": os.environ["GBP_REF"],
            "ref_head": os.environ["GBP_REF_HEAD"],
            "series_conf_sha256_12": os.environ["GBP_SERIES_SHA"],
            "candidates": os.environ.get("GBP_CANDIDATES", "").split(),
            "patch_count": int(os.environ["GBP_COUNT"]),
            "kernel_source_commit": os.environ.get("KERNEL_SOURCE_COMMIT", "unknown"),
            "categories": counts,           # e.g. {"security": 4, "stability": 94}
            "batches": batches,             # raw labels + category + ordered entries
          }
          json.dump(doc, open("/tmp/google-backport-series.json", "w"), indent=2)
          GBP_ASSEMBLE_PY
          {
            echo "GBP_STATE=applied"
            echo "GBP_APPLIED=${GBP_COUNT}"
            echo "GBP_SERIES_SHA=${GBP_SERIES_SHA}"
            echo "GBP_REF=${GBP_REF}"
            echo "GBP_REF_MODE=${GBP_REF_MODE}"
            echo "GBP_REF_HEAD=${GBP_REF_HEAD}"
            echo "GBP_SERIES_ROOT=${GBP_SERIES_ROOT}"
            echo "GBP_CANDIDATES=${GBP_CANDIDATES}"
            echo "GBP_SIDECAR=/tmp/google-backport-series.json"
          } >> "$GITHUB_ENV"
          {
            echo "### Google upstream backport series"
            echo "- State: applied — ${GBP_COUNT} patch(es) from \`${GBP_REF}\` (${GBP_REF_MODE} resolution)"
            echo "- First/last: \`${ENTRIES[0]}\` … \`${ENTRIES[${#ENTRIES[@]}-1]}\`"
            echo "- Series sha256 (series.conf): \`${GBP_SERIES_SHA}\`"
            echo "- Series head: \`${GBP_REF_HEAD}\`"
            echo "- Kernel source commit: \`${KERNEL_SOURCE_COMMIT:-unknown}\`"
            if [[ "$GBP_REF_MODE" == auto ]]; then
              echo "- gki<digits> branches seen: ${GBP_CANDIDATES:-none}"
            fi
            if [[ "${KERNEL_SOURCE_COMMIT:-}" == 8d05d8f2439f* ]]; then
              echo "- KMI baseline: SeriesAuthoredAgainst=8d05d8f2439f"
            else
              echo "- WARNING: kernel source commit \`${KERNEL_SOURCE_COMMIT:-unknown}\` is not the series-authored pin 8d05d8f2439f (tag-fallback landed r33, or the tip moved) — strict apply confirmed the series still fits this tree."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record Google Backport Skip (family gate)
        # C2 (plan §4/D4): the != 'off' guard is required — "off" is a truthy
        # string, so this step used to fire on non-6.6 legs with the toggle
        # OFF and claim "toggle is ON". With the guard, off legs stay truly
        # silent (no GBP_STATE, no sidecar) → the renderer reports "not
        # requested" exactly per D4.
        if: inputs.google_backport && inputs.google_backport != 'off' && inputs.version != 'android15-6.6'
        shell: bash
        env:
          GBP_LEG: ${{ inputs.version }}
          GBP_INPUT: ${{ inputs.google_backport }}
        run: |
          set -euo pipefail
          echo "GBP_STATE=skipped-generation-gate" >> "$GITHUB_ENV"
          # C2 (plan §4/D4): terminal skip-state sidecar — one line, no patch list.
          python3 - <<'GBP_GATE_PY'
          import json, os
          json.dump({
              "schema": "google-backport-series/v1",
              "state": "skipped-generation-gate",
              "leg": os.environ["GBP_LEG"],
              "input": os.environ["GBP_INPUT"],
          }, open("/tmp/google-backport-series.json", "w"), indent=2)
          GBP_GATE_PY
          {
            echo "### Google upstream backport series"
            echo "- State: skipped — toggle is ON but this leg is \`${{ inputs.version }}\`, outside the android15-6.6 self-gate (family expansion playbook: OQ-1)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Spoof /proc/config.gz With Stock Config
        uses: ./.github/actions/stock-config
        with:
          version: ${{ inputs.version }}
          page_size: ${{ inputs.page_size }}
          stock_config_dir: stock-configs

      - name: Set Build Timestamp from Kernel Commit
        shell: bash
        run: |
          set -x
          # Hardcode the build timestamp to the 5th day of the patch level
          # at 04:20 UTC, using the existing timestamp formats expected by the build.
          OS_PATCH_LEVEL_INPUT="${{ inputs.os_patch_level }}"
          if [[ "$OS_PATCH_LEVEL_INPUT" == lts* ]]; then
            if [[ "$OS_PATCH_LEVEL_INPUT" =~ ^lts-([0-9]{2})$ ]]; then
              OS_PATCH_LEVEL_YM="$(date -u +%Y)-${BASH_REMATCH[1]}"
            else
              OS_PATCH_LEVEL_YM="$(date -u +%Y-%m)"
            fi
          else
            OS_PATCH_LEVEL_YM="$OS_PATCH_LEVEL_INPUT"
          fi
          FIXED_BUILD_DATE="${OS_PATCH_LEVEL_YM}-05 04:20:00 UTC"
          SOURCE_DATE_EPOCH=$(date -u -d "$FIXED_BUILD_DATE" +%s)
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> $GITHUB_ENV
          KBUILD_TS=$(date -u -d @${SOURCE_DATE_EPOCH} '+%a %b %d %H:%M:%S UTC %Y')
          echo "KBUILD_BUILD_TIMESTAMP=${KBUILD_TS}" >> $GITHUB_ENV
          # Keep git metadata aligned with the same fixed timestamp.
          GIT_DATE=$(date -u -d @${SOURCE_DATE_EPOCH} '+%Y-%m-%dT%H:%M:%SZ')
          echo "GIT_COMMITTER_DATE=${GIT_DATE}" >> $GITHUB_ENV
          echo "GIT_AUTHOR_DATE=${GIT_DATE}" >> $GITHUB_ENV
          echo "Build timestamp set to: $(date -u -d @${SOURCE_DATE_EPOCH} '+%Y-%m-%d %H:%M:%S UTC') (epoch: $SOURCE_DATE_EPOCH)"

      - name: Extract Sublevel and Set File Name
        id: extract
        uses: ./.github/actions/extract-sublevel-file-name
        with:
          android_version: ${{ inputs.android_version }}
          kernel_version: ${{ inputs.kernel_version }}
          sublevel: ${{ inputs.sublevel }}
          os_patch_level: ${{ inputs.os_patch_level }}
          variant: ${{ inputs.variant }}
          page_size: ${{ inputs.page_size }}

      - name: Kernel Fixes
        uses: ./.github/actions/kernel-fixes
        with:
          version: ${{ inputs.version }}
          android_version: ${{ inputs.android_version }}
          kernel_version: ${{ inputs.kernel_version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}
          os_patch_level: ${{ inputs.os_patch_level }}

      - name: Reject KowSU with SUSFS
        if: inputs.root_flavor == 'kowsu' && (contains(inputs.feature_set, 'SUSFS') || inputs.feature_set == 'All')
        shell: bash
        run: |
          echo "ERROR: KowSU does not work together with SUSFS — re-run with SUSFS off." >&2
          exit 1

      - name: Reject FinaSU without SUSFS
        # FinaSU's kernel hard-depends on the susfs headers and its supercall
        # dispatch references susfs symbols unguarded, so a susfs-less build
        # cannot link. Unlike KernelSU/BakaSU there is no susfs-free shape.
        if: inputs.root_flavor == 'finasu' && !contains(inputs.feature_set, 'SUSFS')
        shell: bash
        run: |
          echo "ERROR: FinaSU requires SUSFS — re-run with SUSFS on." >&2
          exit 1

      - name: Setup Selected Root Implementation
        if: inputs.root_flavor != '' && inputs.root_flavor != 'none'
        uses: ./.github/actions/root-setup
        with:
          flavor: ${{ inputs.root_flavor }}
          commit: ${{ inputs.root_commit }}
          brand_name: ${{ inputs.brand_name }}
          ksu_commit: ${{ env.WILD_KSU_COMMIT }}
          kbuild_build_host: ${{ env.WILD_BUILD_HOST }}
          kbuild_build_user: ${{ env.WILD_BUILD_USER }}

      - name: Mark No Root build metadata
        if: inputs.root_flavor == 'none'
        shell: bash
        env:
          BRAND_RAW: ${{ inputs.brand_name }}
        run: |
          BRAND="$(printf '%s' "$BRAND_RAW" | tr '[:upper:]' '[:lower:]')"
          printf '%s' "$BRAND" | grep -Eq '^[a-z0-9_.-]{1,32}$' || BRAND="wild"
          {
            echo "ROOT_IMPLEMENTATION=none"
            echo "ROOT_MANAGER=N/A"
            echo "ROOT_VERSION=N/A"
            echo "ROOT_COMMIT=N/A"
            # No root: branding falls back to the kernel source's own git HEAD
            # for uname -r; uname -v still carries the (custom) brand.
            echo "WILD_KSU_COMMIT="
            echo "WILD_BUILD_USER=$BRAND"
            echo "WILD_BUILD_HOST="
            echo "WILD_KSU_FORK=none"
          } >> "$GITHUB_ENV"

      - name: Disable SUSFS for BakaSU without SUSFS feature
        if: inputs.root_flavor == 'bakasu' && !contains(inputs.feature_set, 'SUSFS')
        uses: ./.github/actions/set-kernel-config
        with:
          config_list: |
            CONFIG_KSU_SUSFS=n
            CONFIG_KSU_SUSFS_SUS_PATH=n
            CONFIG_KSU_SUSFS_SUS_MOUNT=n
            CONFIG_KSU_SUSFS_SUS_KSTAT=n
            CONFIG_KSU_SUSFS_SPOOF_UNAME=n
            CONFIG_KSU_SUSFS_ENABLE_LOG=n
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=n
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=n
            CONFIG_KSU_SUSFS_OPEN_REDIRECT=n
            CONFIG_KSU_SUSFS_SUS_MAP=n

      - name: Disable SUSFS for SukiSU-Ultra without SUSFS feature
        if: inputs.root_flavor == 'sukisu-ultra' && !contains(inputs.feature_set, 'SUSFS')
        uses: ./.github/actions/set-kernel-config
        with:
          config_list: |
            CONFIG_KSU_SUSFS=n
            CONFIG_KSU_SUSFS_SUS_PATH=n
            CONFIG_KSU_SUSFS_SUS_MOUNT=n
            CONFIG_KSU_SUSFS_SUS_KSTAT=n
            CONFIG_KSU_SUSFS_SPOOF_UNAME=n
            CONFIG_KSU_SUSFS_ENABLE_LOG=n
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=n
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=n
            CONFIG_KSU_SUSFS_OPEN_REDIRECT=n
            CONFIG_KSU_SUSFS_SUS_MAP=n

      - name: SUSFS
        # One step, one action: resolve the SUSFS commit, apply it for the
        # selected root, then run the post-patch fixes (ksu_close_fd restore,
        # selinux_hide 6.6+ shim). All of that lives in
        # .github/actions/susfs/action.yml - the workflow no longer carries
        # SUSFS shell code.
        uses: ./.github/actions/susfs
        with:
          enabled: ${{ contains(inputs.feature_set, 'SUSFS') || inputs.feature_set == 'All' }}
          susfs_commit: ${{ inputs.susfs_commit }}
          version: ${{ inputs.version }}
          android_version: ${{ inputs.android_version }}
          kernel_version: ${{ inputs.kernel_version }}
          os_patch_level: ${{ inputs.os_patch_level }}
          sublevel: ${{ steps.extract.outputs.sublevel }}
          root_flavor: ${{ inputs.root_flavor }}

      - name: Baseband Guard
        if: (contains(inputs.feature_set, 'BBG') || inputs.feature_set == 'All')
        uses: ./.github/actions/bbg

      - name: Setup Networking
        if: contains(inputs.feature_set, 'NET') || inputs.feature_set == 'All'
        uses: ./.github/actions/networking
        with:
          os_patch_level: ${{ inputs.os_patch_level }}
          version: ${{ inputs.version }}
          kernel_version: ${{ inputs.kernel_version }}
          android_version: ${{ inputs.android_version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}

      - name: DroidSpaces-OSS Patches
        if: contains(inputs.feature_set, 'DS') || inputs.feature_set == 'All'
        uses: ./.github/actions/droidspaces
        with:
          version: ${{ inputs.version }}
          android_version: ${{ inputs.android_version }}
          kernel_version: ${{ inputs.kernel_version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}
          os_patch_level: ${{ inputs.os_patch_level }}
          droidspaces_commit: ${{ inputs.droidspaces_commit }}

      - name: Apply NTSync Patches
        if: contains(inputs.feature_set, 'NTSync')
        uses: ./.github/actions/ntsync
        with:
          version: ${{ inputs.version }}
          kernel_version: ${{ inputs.kernel_version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}

      - name: Apply Ptrace Patch
        if: contains(inputs.feature_set, 'Ptrace')
        uses: ./.github/actions/ptrace
        with:
          kernel_version: ${{ inputs.kernel_version }}

      - name: Apply Unicode Fix Patch
        if: contains(inputs.feature_set, 'Unicode')
        uses: ./.github/actions/unicode-fix
        with:
          kernel_version: ${{ inputs.kernel_version }}

      - name: Apply Performance Patches
        uses: ./.github/actions/performance
        if: contains(inputs.feature_set, 'Perf')
        with:
          kernel_version: ${{ inputs.kernel_version }}

      - name: Setup Misc Configs
        uses: ./.github/actions/misc
        with:
          version: ${{ inputs.version }}
          kernel_version: ${{ inputs.kernel_version }}
          android_version: ${{ inputs.android_version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}
          variant: ${{ inputs.variant }}

      - name: Enable BPF Stack (BTF + eBPF + FUSE-BPF)
        if: contains(inputs.feature_set, 'BPF')
        uses: ./.github/actions/btf
        with:
          version: ${{ inputs.version }}
          kernel_version: ${{ inputs.kernel_version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}

      - name: Apply Device-Specific Patches
        uses: ./.github/actions/apply-device-patches
        with:
          version: ${{ inputs.version }}
          kernel_version: ${{ inputs.kernel_version }}

      - name: Integrate NoMount
        if: contains(inputs.feature_set, 'NoMount') || inputs.feature_set == 'All'
        uses: ./.github/actions/nomount
        with:
          commit: ${{ inputs.nomount_commit }}
          kernel_version: ${{ inputs.kernel_version }}

      - name: Apply Kernel Branding
        uses: ./.github/actions/apply-kernel-branding
        with:
          variant: ${{ inputs.variant }}
          kernel_version: ${{ inputs.kernel_version }}
          android_version: ${{ inputs.android_version }}
          version: ${{ inputs.version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}
          brand_name: ${{ inputs.brand_name }}
          keep_kmi: ${{ inputs.keep_kmi }}
          ksu_commit: ${{ env.WILD_KSU_COMMIT }}
          kbuild_build_host: ${{ env.WILD_BUILD_HOST }}
          kbuild_build_user: ${{ env.WILD_BUILD_USER }}

      - name: Remove Protected Exports
        uses: ./.github/actions/remove-protected-exports

      - name: Clean Kernel Flags
        uses: ./.github/actions/clean-kernel-flags

      - name: Scan and collect patch rejects
        id: scan
        if: always()
        uses: ./.github/actions/scan-patch-rejects

      - name: Upload Rejects
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.extract.outputs.file_name }}-Rejects
          path: patch-rejects/
          if-no-files-found: ignore
          compression-level: 9

      - name: "Setup Cache and Build Environment"
        if: inputs.use_cache
        uses: ./.github/actions/cache-setup
        with:
          version: ${{ inputs.version }}
          android_version: ${{ inputs.android_version }}
          kernel_version: ${{ inputs.kernel_version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}

      - name: Restore ccache
        id: restore-ccache
        continue-on-error: true
        if: inputs.use_cache && (inputs.version == 'android12-5.10' || inputs.version == 'android13-5.10' || inputs.version == 'android13-5.15')
        uses: ./.github/actions/cache-restore
        with:
          cache_path: /home/runner/.ccache
          cache_key: ${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ steps.extract.outputs.sublevel }}-${{ inputs.os_patch_level }}-${{ inputs.variant }}
          cache_bucket: ccache-cache-${{ inputs.version }}-${{ inputs.variant }}
          restore_keys: |
            ${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ steps.extract.outputs.sublevel }}-

      - name: Restore bazel-cache
        id: restore-bazel
        continue-on-error: true
        if: inputs.use_cache && (inputs.version == 'android14-5.15' || inputs.version == 'android14-6.1' || inputs.version == 'android15-6.6' || inputs.version == 'android16-6.12')
        uses: ./.github/actions/cache-restore
        with:
          cache_path: /home/runner/.cache/bazel
          cache_key: ${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ steps.extract.outputs.sublevel }}-${{ inputs.os_patch_level }}-${{ inputs.variant }}${{ inputs.page_size == '16k' && '-16k' || '' }}
          cache_bucket: bazel-cache-${{ inputs.version }}-${{ inputs.variant }}${{ inputs.page_size == '16k' && '-16k' || '' }}
          restore_keys: |
            ${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ steps.extract.outputs.sublevel }}-

      - name: Check cache hit
        run: |
          echo "Cache restore status:"
          CCACHE_HIT="${{ steps.restore-ccache.outputs.cache-hit || 'skipped' }}"
          BAZEL_HIT="${{ steps.restore-bazel.outputs.cache-hit || 'skipped' }}"
          echo "  ccache: $CCACHE_HIT"
          echo "  bazel: $BAZEL_HIT"

      - name: Get Cache Stats
        uses: ./.github/actions/cache-stats
        with:
          clear_stats: true

      - name: Initialize Config Fragment
        run: touch "${{ github.workspace }}/wild_gki.fragment"

      - name: Apply Kernel Bypass Hack
        if: ${{ inputs.allow_version_mismatch == true }}
        uses: ./.github/actions/bypass-kernel
        with:
          version: ${{ inputs.version }}
          allow_version_mismatch: true

      # --- ABI gate phase 1 (plan v2.2.0 §12.4): baseline build ----------
      # Runs the full build once on the tree as Wild machinery left it
      # (pre-features), so the ONLY delta vs the final build is the Part I
      # feature steps below. With use_cache this reuses the restored warm
      # cache; abi_gate: off skips it entirely (zero overhead).
      - name: "ABI gate build #1: pristine-tree baseline (pre-features)"
        if: inputs.abi_gate != 'off'
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
          KBUILD_BUILD_TIMESTAMP: ${{ env.KBUILD_BUILD_TIMESTAMP }}
          KBUILD_BUILD_USER: ${{ env.WILD_BUILD_USER != '' && env.WILD_BUILD_USER || ((inputs.version == 'android15-6.6' || inputs.version == 'android16-6.12') && 'kleaf' || 'build-user') }}
          KBUILD_BUILD_HOST: ${{ env.WILD_BUILD_HOST != '' && env.WILD_BUILD_HOST || 'build-host' }}
        uses: ./.github/actions/build-kernel
        with:
          version: ${{ inputs.version }}
          page_size: ${{ inputs.page_size }}
          kbuild_build_user: ${{ env.WILD_BUILD_USER }}
          kbuild_build_host: ${{ env.WILD_BUILD_HOST }}
          log_label: baseline

      - name: "ABI gate: capture baseline Module.symvers"
        id: abi-baseline
        if: inputs.abi_gate != 'off'
        shell: bash
        working-directory: ${{ github.workspace }}/kernel
        run: |
          set -euo pipefail
          SYMVERS=""
          for candidate in \
            bazel-bin/common/kernel_aarch64/Module.symvers \
            /home/runner/out/common/Module.symvers \
            /home/runner/out/dist/Module.symvers; do
            if [ -s "$candidate" ]; then SYMVERS="$candidate"; break; fi
          done
          if [ -z "$SYMVERS" ]; then
            SYMVERS="$(find bazel-bin/common /home/runner/out -maxdepth 4 -name Module.symvers -type f 2>/dev/null | head -n1 || true)"
          fi
          if [ -z "$SYMVERS" ]; then
            echo "ERROR: could not locate the baseline build's Module.symvers" >&2
            exit 1
          fi
          echo "baseline Module.symvers: $SYMVERS"
          mkdir -p "${{ github.workspace }}/abi-out"
          bash "${{ github.workspace }}/.github/scripts/abi-gate.sh" capture "$SYMVERS" "${{ github.workspace }}/abi-out"
          echo "ABI_BASELINE=${{ github.workspace }}/abi-out/Module.symvers.baseline" >> "$GITHUB_ENV"

      # --- Part I feature series (plan §9 wiring point; repositioned after
      # every Wild tree-modifying step so the ABI gate delta is exactly the
      # feature series) ----------------------------------------------------
      # --- feature series: ONE manifest-driven applier (plan v3.0.0 SS3.3) ---
      # Replaces the old bore -> momentx -> governor action calls and their
      # per-feature inputs; per-governor toggles become PATCHES.yml rows
      # (manifest enabled: / features: input). Strict failures stay red after
      # the artifact upload via the enforce step; best_effort failures are
      # warn+skip inside the applier (D16).
      - name: Apply feature patches (manifest-driven, from feature/patches)
        id: feature-patches
        continue-on-error: true
        uses: ./.github/actions/feature-patches
        with:
          manifest_ref: ${{ inputs.patches_ref }}
          features: ${{ inputs.features }}

      - name: Upload patch-apply failure artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.extract.outputs.file_name }}-patch-apply-logs
          path: patch-apply-logs/**
          if-no-files-found: ignore
          compression-level: 9

      - name: Enforce applier verdict
        if: always() && steps['feature-patches'].outcome == 'failure'
        shell: bash
        run: |
          echo "::error::feature-patches applier failed (strict mode) - see patch-apply-logs artifact + step summary"
          exit 1

      - name: Normalize feature config fragment (D17, scoped)
        if: steps['feature-patches'].outputs.config_fragment != ''
        id: normalize-fragment
        shell: bash
        env:
          FRAG: ${{ steps['feature-patches'].outputs.config_fragment }}
        run: |
          set -euo pipefail
          # D17 (incident run 114640000078): the applier's fragment may arrive
          # space-joined on one line. The first fix normalized GLOBALLY inside
          # set-kernel-config, which shredded other callers' "# comment" lines
          # (btf action, Issues #176/#211): the split orphaned the "#" and the
          # no-"=" fallback appended every word as <word>=y. So the recovery
          # lives HERE, scoped to the feature/patches fragment only: split
          # spaces, keep strict CONFIG_X=<v> lines, drop everything else
          # loudly instead of letting it near gki_defconfig.
          TOTAL=$(printf '%s\n' "$FRAG" | tr ' ' '\n' | grep -c . || true)
          KEPT=$(printf '%s\n' "$FRAG" | tr ' ' '\n' | grep -cE '^CONFIG_[A-Za-z0-9_]+=' || true)
          echo "fragment: $KEPT CONFIG line(s) kept, $((TOTAL - KEPT)) non-CONFIG line(s) dropped"
          {
            echo "config_list<<FRAG_EOF"
            printf '%s\n' "$FRAG" | tr ' ' '\n' | grep -E '^CONFIG_[A-Za-z0-9_]+=' || true
            echo "FRAG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Enable selected feature configs
        if: steps['normalize-fragment'].outputs.config_list != ''
        uses: ./.github/actions/set-kernel-config
        with:
          config_list: ${{ steps['normalize-fragment'].outputs.config_list }}

      - name: Build Normal Kernel
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
          KBUILD_BUILD_TIMESTAMP: ${{ env.KBUILD_BUILD_TIMESTAMP }}
          KBUILD_BUILD_USER: ${{ env.WILD_BUILD_USER != '' && env.WILD_BUILD_USER || ((inputs.version == 'android15-6.6' || inputs.version == 'android16-6.12') && 'kleaf' || 'build-user') }}
          KBUILD_BUILD_HOST: ${{ env.WILD_BUILD_HOST != '' && env.WILD_BUILD_HOST || 'build-host' }}
        uses: ./.github/actions/build-kernel
        with:
          version: ${{ inputs.version }}
          page_size: ${{ inputs.page_size }}
          kbuild_build_user: ${{ env.WILD_BUILD_USER }}
          kbuild_build_host: ${{ env.WILD_BUILD_HOST }}
          log_label: final

      # Dedupe compiler/linker errors from the captured kbuild logs so one
      # red run surfaces EVERY broken file (make -k keeps building past the
      # first error). Diagnostic only: never masks the build's own failure.
      # D20: runs only when the ACTIONS_RUNNER_DEBUG gate is ON; skipped
      # entirely otherwise.
      - name: Collect build-error digest
        if: always() && env.CI_DIAGNOSTICS == 'true'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -uo pipefail
          LOGDIR="$PWD/ci-logs"
          if ! ls "$LOGDIR"/kbuild-*.log >/dev/null 2>&1; then
            echo "No kbuild logs under $LOGDIR; nothing to digest."
            exit 0
          fi
          DIGEST="$LOGDIR/errors-digest.txt"
          ERRS="$(grep -hE 'error:|ERROR:|Error [0-9]+|FAILED:' "$LOGDIR"/kbuild-*.log 2>/dev/null | sort -u | head -300 || true)"
          if [ -n "$ERRS" ]; then
            { echo "=== unique error lines (deduped, first 300) ==="; echo "$ERRS"; } > "$DIGEST"
            cat "$DIGEST"
            { echo "## Build error digest"; echo '```'; cat "$DIGEST"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo
            echo "Digest: ci-logs/errors-digest.txt (also in the job summary). Full raw kbuild output rides the ci-logs artifact."
          else
            echo "No compiler/linker error lines in the captured logs."
            echo "(no error lines captured)" > "$DIGEST"
          fi

      # --- ABI gate phase 2 (plan v2.2.0 §12.4): zero-delta check ---------
      # Baseline = this run's pristine pre-feature build; current = the
      # feature build above. warn mode reports loudly but never blocks
      # (phase A); enforce fails the job (phase C, D11).
      - name: "ABI gate: existing-symbol zero-delta check"
        if: inputs.abi_gate != 'off'
        shell: bash
        working-directory: ${{ github.workspace }}/kernel
        env:
          ABI_GATE_MODE: ${{ inputs.abi_gate }}
        run: |
          set -euo pipefail
          # 25-input consolidation: the D9 fail-on-new canary now rides the
          # abi_gate mode string as a "+fail-new" suffix; policy = base mode.
          ABI_GATE_FAIL_ON_NEW=$([[ "$ABI_GATE_MODE" == *"+fail-new" ]] && echo true || echo false)
          GATE_POLICY="${ABI_GATE_MODE%%+*}"
          ABI_DIR="${{ github.workspace }}/abi-out"
          [ -s "$ABI_BASELINE" ] || { echo "ERROR: baseline missing ($ABI_BASELINE) — capture step did not run?" >&2; exit 1; }
          FLAG=""
          [ "$ABI_GATE_FAIL_ON_NEW" = "true" ] && FLAG="--fail-on-new"
          SYMVERS=""
          for candidate in \
            bazel-bin/common/kernel_aarch64/Module.symvers \
            /home/runner/out/common/Module.symvers \
            /home/runner/out/dist/Module.symvers; do
            if [ -s "$candidate" ]; then SYMVERS="$candidate"; break; fi
          done
          if [ -z "$SYMVERS" ]; then
            SYMVERS="$(find bazel-bin/common /home/runner/out -maxdepth 4 -name Module.symvers -type f 2>/dev/null | head -n1 || true)"
          fi
          if [ -z "$SYMVERS" ]; then
            echo "ERROR: could not locate the feature build's Module.symvers" >&2
            exit 1
          fi
          echo "current Module.symvers: $SYMVERS"
          set +e
          bash "${{ github.workspace }}/.github/scripts/abi-gate.sh" $FLAG check \
            "$ABI_BASELINE" "$SYMVERS" "$ABI_DIR/abi-delta.txt" 2>&1 | tee "$ABI_DIR/check.log"
          RC="${PIPESTATUS[0]}"
          set -e
          {
            echo "## ABI gate — $ABI_GATE_MODE mode"
            echo
            echo '```'
            cat "$ABI_DIR/check.log"
            echo '```'
            echo "- policy: existing symbols zero-delta; new symbols $([ "$ABI_GATE_FAIL_ON_NEW" = "true" ] && echo 'FAIL (--fail-on-new)' || echo 'info only')"
            echo "- baseline: \`$ABI_BASELINE\`"
            echo "- current: \`$SYMVERS\`"
            echo "- evidence: \`abi-delta.txt\` + \`check.log\` in the ABI-gate artifact"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$RC" -ne 0 ]; then
            if [ "$GATE_POLICY" = "enforce" ]; then
              echo "::error::ABI gate FAIL (mode=$GATE_POLICY): missing symbol or CRC delta on an existing export vs this run's pristine baseline — see step summary and the ABI-gate artifact"
              exit 1
            fi
            echo "::warning::ABI gate FAIL (mode=$GATE_POLICY): missing symbol or CRC delta vs the pristine baseline — advisory only (phase A), see step summary and the ABI-gate artifact"
            exit 0
          fi
          echo "ABI gate PASS (mode=$ABI_GATE_MODE)"

      - name: Upload ABI gate evidence
        if: always() && inputs.abi_gate != 'off'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.extract.outputs.file_name }}-ABI-gate
          path: abi-out/**
          if-no-files-found: ignore
          compression-level: 9

      # GitHub truncates long step logs in the web UI; the raw tee'd kbuild
      # logs (both ABI legs) survive here even when the job is red.
      # D20: skipped entirely when the ACTIONS_RUNNER_DEBUG gate is OFF.
      - name: Upload build logs (full kbuild output)
        if: always() && env.CI_DIAGNOSTICS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.extract.outputs.file_name }}-ci-logs
          path: ci-logs/**
          if-no-files-found: ignore
          compression-level: 9

      - name: Get Cache Stats
        uses: ./.github/actions/cache-stats
        with:
          clear_stats: false

      - name: Prune ccache before save
        if: always() && inputs.use_cache && (inputs.version == 'android12-5.10' || inputs.version == 'android13-5.10' || inputs.version == 'android13-5.15')
        shell: bash
        run: |
          if [ -d /home/runner/.ccache ]; then
            ccache -c 2>/dev/null || true
            find /home/runner/.ccache -type f -mtime +0.5 -delete 2>/dev/null || true
            find /home/runner/.ccache -type d -empty -delete 2>/dev/null || true
            echo "ccache pruned"; ccache -s 2>/dev/null | head -20 || true
          fi

      - name: Save ccache
        continue-on-error: true
        uses: ./.github/actions/cache-save
        if: always() && inputs.use_cache && (inputs.version == 'android12-5.10' || inputs.version == 'android13-5.10' || inputs.version == 'android13-5.15')
        with:
          cache_path: /home/runner/.ccache
          cache_key: ${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ steps.extract.outputs.sublevel }}-${{ inputs.os_patch_level }}-${{ inputs.variant }}
          cache_bucket: "ccache-cache-${{ inputs.version }}-${{ inputs.variant }}"
          compression_level: 9
          github_token: ${{ github.token }}

      - name: Save bazel-cache
        continue-on-error: true
        uses: ./.github/actions/cache-save
        if: always() && inputs.use_cache && (inputs.version == 'android14-5.15' || inputs.version == 'android14-6.1' || inputs.version == 'android15-6.6' || inputs.version == 'android16-6.12')
        with:
          cache_path: /home/runner/.cache/bazel
          cache_key: ${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ steps.extract.outputs.sublevel }}-${{ inputs.os_patch_level }}-${{ inputs.variant }}${{ inputs.page_size == '16k' && '-16k' || '' }}
          cache_bucket: "bazel-cache-${{ inputs.version }}-${{ inputs.variant }}${{ inputs.page_size == '16k' && '-16k' || '' }}"
          compression_level: 9
          github_token: ${{ github.token }}

      - name: Consolidated Build Summary
        id: build-summary
        if: always()
        uses: ./.github/actions/build-summary
        with:
          job_status: ${{ job.status }}
          file_name: ${{ steps.extract.outputs.file_name }}
          kernel_version: ${{ inputs.kernel_version }}
          sublevel: ${{ inputs.sublevel }}
          android_version: ${{ inputs.android_version }}
          os_patch_level: ${{ inputs.os_patch_level }}
          variant: ${{ inputs.variant }}
          page_size: ${{ inputs.page_size }}
          feature_set: ${{ inputs.feature_set }}
          nomount_commit: ${{ inputs.nomount_commit }}
          susfs_commit: ${{ inputs.susfs_commit }}

      - name: Upload Artifacts
        id: kernel-artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.extract.outputs.file_name }}-AnyKernel3
          path: ${{ github.workspace }}/AnyKernel3/**
          if-no-files-found: ignore
          compression-level: 9

      - name: Write Build-verified only artifact metadata
        if: success() && inputs.root_flavor != '' && inputs.root_flavor != 'none'
        uses: ./.github/actions/build-metadata
        with:
          summary_base: ${{ steps.build-summary.outputs.summary_base }}
          file_name: ${{ steps.extract.outputs.file_name }}
          feature_set: ${{ inputs.feature_set }}
          nomount_commit: ${{ inputs.nomount_commit }}
          android_version: ${{ inputs.android_version }}
          kernel_version: ${{ inputs.kernel_version }}
          os_patch_level: ${{ inputs.os_patch_level }}
          page_size: ${{ inputs.page_size }}

      - name: Upload Build Summary + Metadata
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.extract.outputs.file_name }}-BuildInfo
          path: /tmp/build-summary-${{ steps.build-summary.outputs.summary_base }}.md
          if-no-files-found: warn
          compression-level: 9
