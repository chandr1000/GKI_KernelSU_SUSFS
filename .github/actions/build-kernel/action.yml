name: 'Build Kernel'
description: 'Builds kernel using legacy build.sh or Bazel (kleaf)'
inputs:
  version:
    description: 'Kernel config version (e.g., android14-6.1)'
    required: true
  page_size:
    description: 'ARM64 page size: 4k (default, unchanged behaviour) or 16k'
    required: false
    type: string
    default: '4k'
  allow_version_mismatch:
    description: 'Whether to force-load version-mismatched modules'
    required: false
    type: boolean
    default: false
  kbuild_build_user:
    description: |
      Value for the KBUILD_BUILD_USER env var. Appears in `uname -v` as
      the user before the `@` (e.g., `wild@host`).
      Empty string = use the kernel's default.
      Sourced from env.WILD_BUILD_USER (set by root-setup from brand_name).
    required: false
    default: ''
  kbuild_build_host:
    description: |
      Value for KBUILD_BUILD_HOST. Appears in `uname -v` as the host
      after the `@` (e.g., `wild@KernelSU-Next-v30337`).
      Empty string = use the kernel's default.
      Sourced from env.WILD_BUILD_HOST (set by root-setup).
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup Kernel Configs
      if: false
      uses: ./.github/actions/set-kernel-config

    # - name: Provide host ld from repo prebuilts
    #   shell: bash
    #   run: |
    #     cd "${{ github.workspace }}/kernel"
    #     # build.sh REPLACES PATH with 4 repo dirs (build-tools/path,
    #     # prebuilt clang bin, prebuilts/gas, out/host_tools), so /usr/bin and
    #     # /usr/local/bin are invisible: apt binutils can NOT fix this. Instead,
    #     # symlink ld.lld as "ld" inside the prebuilt clang's own bin dir -- the
    #     # clang driver looks there first, no PATH needed.
    #     # Dynamic, not hardcoded: resolve CLANG_PREBUILT_BIN exactly the way
    #     # build.sh does -- source build.config.constants (CLANG_VERSION) then
    #     # the same BUILD_CONFIG the build uses (build.config.gki.aarch64 chain).
    #     # ("|| true": runner shell is -e -o pipefail; failures here must fall
    #     # through to the loud error below, not kill the step silently.)
    #     CLANG_BIN=""
    #     if [ -f "common/build.config.gki.aarch64" ]; then
    #       CLANG_BIN=$(ROOT_DIR="$PWD" KERNEL_DIR=common bash -c '[ -f common/build.config.constants ] && . common/build.config.constants; . common/build.config.gki.aarch64; echo "$CLANG_PREBUILT_BIN"' || true)
    #     fi
    #     if [ -n "$CLANG_BIN" ] && [ -d "$CLANG_BIN" ] && [ -f "$CLANG_BIN/ld.lld" ]; then
    #       echo "Build clang bin (from build.config chain): $CLANG_BIN"
    #       ln -sf "ld.lld" "$CLANG_BIN/ld"
    #       ls -la "$CLANG_BIN/ld"
    #     else
    #       echo "ERROR: could not resolve build clang (got: '$CLANG_BIN')" >&2
    #       echo "--- workspace/kernel:" >&2
    #       ls "${{ github.workspace }}/kernel"
    #       exit 1
    #     fi

    - name: 'Build Kernel'
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      env:
        KBUILD_BUILD_USER: ${{ inputs.kbuild_build_user }}
        KBUILD_BUILD_HOST: ${{ inputs.kbuild_build_host }}
      run: |
        PAGE_SIZE="${{ inputs.page_size }}"
        [ -n "$KBUILD_BUILD_USER" ] && export KBUILD_BUILD_USER
        [ -n "$KBUILD_BUILD_HOST" ] && export KBUILD_BUILD_HOST
        echo "KBUILD_BUILD_USER=${KBUILD_BUILD_USER:-(default)}"
        echo "KBUILD_BUILD_HOST=${KBUILD_BUILD_HOST:-(default)}"
        sed -i 's/check_defconfig//' ./common/build.config.gki
        if [ -f "build/build.sh" ]; then
          if [ "$PAGE_SIZE" != "4k" ]; then
            echo "ERROR: page_size=${PAGE_SIZE} is only supported by the Kleaf (Bazel) build; this tree uses build/build.sh." >&2
            exit 1
          fi
          BUILD_GKI_ARTIFACTS="" \
          BUILD_GKI_CERTIFICATION_TOOLS=0 \
          BUILD_SYSTEM_DLKM=0 \
          SKIP_VENDOR_BOOT=1 \
          SKIP_EXT_MODULES=1 \
          SKIP_CP_KERNEL_HDR=1 \
          OUT_DIR="/home/runner/out" \
          LTO=thin \
          BUILD_CONFIG=common/build.config.gki.aarch64 \
          CC="/usr/bin/ccache clang" \
          CXX="/usr/bin/ccache clang++" \
          HOSTCC="/usr/bin/ccache clang" \
          HOSTCXX="/usr/bin/ccache clang++" \
          build/build.sh -j"$(nproc)"
        else
          sed -i '/name = "kernel_aarch64",/a\    check_defconfig = "disabled",' common/BUILD.bazel
          PAGE_SIZE_FLAGS=()
          if [ "$PAGE_SIZE" = "16k" ]; then
            PAGE_SIZE_FLAGS+=(--page_size=16k)
          fi
          ACTION_ENV_FLAGS=""
          [ -n "$KBUILD_BUILD_USER" ] && ACTION_ENV_FLAGS="$ACTION_ENV_FLAGS --action_env=KBUILD_BUILD_USER"
          [ -n "$KBUILD_BUILD_HOST" ] && ACTION_ENV_FLAGS="$ACTION_ENV_FLAGS --action_env=KBUILD_BUILD_HOST"
          tools/bazel build \
            --config=fast \
            "${PAGE_SIZE_FLAGS[@]}" \
            --config=stamp \
            $ACTION_ENV_FLAGS \
            --disk_cache=/home/runner/.cache/bazel \
            //common:kernel_aarch64/Image
        fi

    - name: 'Verify Page Size in Generated .config'
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail
        PAGE_SIZE="${{ inputs.page_size }}"

        # Kleaf writes the resolved .config under the kernel_config rule output
        # dir; the legacy build.sh writes it into OUT_DIR. Locate it instead of
        # hardcoding a path that upstream may rename.
        CONFIG_FILE=""
        for candidate in \
          bazel-bin/common/kernel_aarch64_config/out_dir/.config \
          /home/runner/out/.config; do
          if [ -f "$candidate" ]; then CONFIG_FILE="$candidate"; break; fi
        done
        if [ -z "$CONFIG_FILE" ]; then
          CONFIG_FILE="$(find bazel-bin/common /home/runner/out -maxdepth 4 -name .config -type f 2>/dev/null | head -n1 || true)"
        fi
        if [ -z "$CONFIG_FILE" ]; then
          if [ "$PAGE_SIZE" != "16k" ]; then
            # 4k builds are unchanged from before this feature; a missing .config
            # is a gap in the check, not a reason to fail a working build.
            echo "WARNING: no .config found; skipping page-size verification for 4k."
            exit 0
          fi
          echo "ERROR: could not locate the generated .config; page size cannot be verified." >&2
          exit 1
        fi
        echo "Verifying page size using $CONFIG_FILE"
        grep -E '^(# )?CONFIG_ARM64_(4K|16K|64K)_PAGES|^CONFIG_ARM64_PAGE_SHIFT' "$CONFIG_FILE" || true

        # Susfs-presence probe on the built image: the fs/susfs.o objects leave
        # their log-format strings in .rodata; a zero count means susfs was
        # trimmed somewhere between config and link.
        for img in bazel-bin/common/kernel_aarch64/Image /home/runner/out/dist/Image; do
          if [ -f "$img" ]; then
            echo "susfs strings in $(basename "$img"): $(grep -ac susfs "$img" || true)"
            break
          fi
        done

        # Root/susfs config probe: the Kleaf config stage has been observed to
        # drop KSU configs in flavour builds; surface the block and fail loud
        # when the root implementation's configs went missing.
        echo "--- KSU config block from $CONFIG_FILE ---"
        grep -E '^#? ?CONFIG_KSU' "$CONFIG_FILE" || echo '(no CONFIG_KSU entries in final .config)'
        if [ "${ROOT_IMPLEMENTATION:-}" != '' ] && [ "${ROOT_IMPLEMENTATION:-}" != 'none' ]; then
          if ! grep -q '^CONFIG_KSU=y' "$CONFIG_FILE"; then
            echo "ERROR: CONFIG_KSU missing from final .config (root: $ROOT_IMPLEMENTATION)" >&2
            exit 1
          fi
          if [ -n "${SUSFS_COMMIT:-}" ] && ! grep -q '^CONFIG_KSU_SUSFS=y' "$CONFIG_FILE"; then
            echo "ERROR: CONFIG_KSU_SUSFS missing from final .config (root: $ROOT_IMPLEMENTATION, susfs ${SUSFS_COMMIT})" >&2
            exit 1
          fi
        fi

        # KPM bridge probe (sukisu-ultra only): the KPM Kconfig selects
        # KALLSYMS and KALLSYMS_ALL, so a missing entry means the config
        # stage dropped it (kleaf flavour builds have done this before).
        if [ "${ROOT_IMPLEMENTATION:-}" = 'sukisu-ultra' ]; then
          if ! grep -q '^CONFIG_KPM=y' "$CONFIG_FILE"; then
            echo "ERROR: CONFIG_KPM missing from final .config (root: sukisu-ultra)" >&2
            exit 1
          fi
          if ! grep -q '^CONFIG_KALLSYMS_ALL=y' "$CONFIG_FILE"; then
            echo "ERROR: CONFIG_KALLSYMS_ALL missing from final .config (root: sukisu-ultra)" >&2
            exit 1
          fi
        fi

        if [ "$PAGE_SIZE" = "16k" ]; then
          want_on="CONFIG_ARM64_16K_PAGES=y"
          want_off="# CONFIG_ARM64_4K_PAGES is not set"
        else
          want_on="CONFIG_ARM64_4K_PAGES=y"
          want_off="# CONFIG_ARM64_16K_PAGES is not set"
        fi

        if ! grep -qx "$want_on" "$CONFIG_FILE"; then
          echo "ERROR: expected '$want_on' in $CONFIG_FILE" >&2
          grep -E '^(# )?CONFIG_ARM64_(4K|16K|64K)_PAGES' "$CONFIG_FILE" >&2 || true
          exit 1
        fi
        if ! grep -qx "$want_off" "$CONFIG_FILE"; then
          echo "ERROR: expected '$want_off' in $CONFIG_FILE" >&2
          grep -E '^(# )?CONFIG_ARM64_(4K|16K|64K)_PAGES' "$CONFIG_FILE" >&2 || true
          exit 1
        fi
        echo "Page size verified: ${PAGE_SIZE}"

    - name: 'Inject KPM (kpimg) into Kernel Image'
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      env:
        KPM_PATCH_REPO: https://github.com/ShirkNeko/SukiSU_KernelPatch_patch
        KPM_PATCH_REPO_SHA: d958d2582fe3b7eaaeaf238b3bf9af4507a81174
        KPIMG_URL: https://raw.githubusercontent.com/ShirkNeko/SukiSU_patch/refs/heads/main/kpm/kpimg
        # Superkey '123' is not a secret: the SukiSU manager itself hardcodes
        # "-s 123" (manager KpmPatchCommand.kt) for every patch it applies, and
        # kptools merely requires a non-empty key at patch time. The SukiSU
        # kpimg fork has no key-gated privilege surface: its supercall hook
        # ignores EL0 callers entirely (kernel/patch/sukisu/sukisu.c) and KPM
        # module ops are gated by the KernelSU extension ioctl + manager
        # signature, not by the key. Root authorization is KernelSU's
        # allowlist, unchanged by this step.
        KPM_SUPERKEY: '123'
      run: |
        set -euo pipefail

        # KPM needs two halves: the kernel-side bridge (CONFIG_KPM=y, built
        # above) and KernelPatch's kpimg engine, which is not part of the
        # kernel build and must be injected into the finished Image with
        # kptools. Without it the manager's KPM probe calls the unhooked
        # __arm64_sys_truncate, gets an error instead of the KP ABI version,
        # and reports "KPM not supported" despite CONFIG_KPM=y.
        if [ "${ROOT_IMPLEMENTATION:-}" != "sukisu-ultra" ]; then
          echo "Root flavor '${ROOT_IMPLEMENTATION:-<none>}' has no KPM bridge; skipping kpimg injection."
          exit 0
        fi

        IMG=""
        for candidate in bazel-bin/common/kernel_aarch64/Image /home/runner/out/dist/Image; do
          if [ -f "$candidate" ]; then IMG="$candidate"; break; fi
        done
        if [ -z "$IMG" ]; then
          echo "ERROR: kernel Image not found (tried bazel-bin/common/kernel_aarch64/Image and /home/runner/out/dist/Image)" >&2
          exit 1
        fi
        OLD_SIZE=$(stat -c%s "$IMG")
        echo "KPM target Image: $IMG ($OLD_SIZE bytes)"

        WORK_DIR="$(mktemp -d)"
        trap 'rm -rf "$WORK_DIR"' EXIT

        # The prebuilt kptools the manager downloads is an aarch64 Android
        # binary (interpreter /system/bin/linker64) and cannot run on x86_64
        # runners, so build the host tool from a pinned source snapshot.
        echo "Fetching kptools source: ${KPM_PATCH_REPO} @ ${KPM_PATCH_REPO_SHA}"
        curl -fsSL "${KPM_PATCH_REPO}/archive/${KPM_PATCH_REPO_SHA}.tar.gz" -o "$WORK_DIR/kptools-src.tar.gz"
        tar -xzf "$WORK_DIR/kptools-src.tar.gz" -C "$WORK_DIR"
        if ! [ -e /usr/include/zlib.h ]; then
          echo "Installing zlib headers for the static kptools link"
          sudo apt-get update -qq && sudo apt-get install -y -qq zlib1g-dev
        fi
        make -C "$WORK_DIR/SukiSU_KernelPatch_patch-${KPM_PATCH_REPO_SHA}/tools" -j"$(nproc)"
        KPTOOLS="$WORK_DIR/SukiSU_KernelPatch_patch-${KPM_PATCH_REPO_SHA}/tools/kptools"
        "$KPTOOLS" -v

        # kpimg is appended data, not a runner-executable: take the canonical
        # prebuilt from the exact URL the SukiSU manager's own KPM boot
        # patcher downloads, so the engine/bridge ABI pairing matches what
        # userspace expects.
        curl -fsSL "$KPIMG_URL" -o "$WORK_DIR/kpimg"
        [ -s "$WORK_DIR/kpimg" ] || { echo "ERROR: downloaded kpimg is empty" >&2; exit 1; }

        # Pre-flight (informational): the embedded ikconfig should already
        # carry the bridge configs; the authoritative check is the .config
        # probe in the verify step above.
        "$KPTOOLS" -f -i "$IMG" 2>/dev/null | grep -E '^CONFIG_(KPM|KALLSYMS|KALLSYMS_ALL)=' \
          || echo "NOTE: ikconfig dump unavailable or incomplete (kernel may lack CONFIG_IKCONFIG); continuing"

        "$KPTOOLS" -p -s "$KPM_SUPERKEY" -i "$IMG" -k "$WORK_DIR/kpimg" -o "$IMG.kpm"

        NEW_SIZE=$(stat -c%s "$IMG.kpm")
        [ -s "$IMG.kpm" ] || { echo "ERROR: kptools produced no output" >&2; exit 1; }
        if [ "$NEW_SIZE" -le "$OLD_SIZE" ]; then
          echo "ERROR: patched Image did not grow ($OLD_SIZE -> $NEW_SIZE); kpimg was not appended" >&2
          exit 1
        fi
        # kptools must recognise its own patch: -l parses the KP preset and
        # errors out on an unpatched image.
        "$KPTOOLS" -l -i "$IMG.kpm"
        echo "$IMG.kpm ikconfig: $("$KPTOOLS" -f -i "$IMG.kpm" 2>/dev/null | grep -E '^CONFIG_KPM=' || echo '(ikconfig dump unavailable)')"

        mv "$IMG.kpm" "$IMG"
        echo "KPM engine injected into $IMG ($OLD_SIZE -> $NEW_SIZE bytes, superkey '$KPM_SUPERKEY')"

    - name: 'Gather Build Artifacts'
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail
        if [ -f "bazel-bin/common/kernel_aarch64/Image" ]; then
          echo "Found Image at bazel-bin/common/kernel_aarch64/Image"
          cp "bazel-bin/common/kernel_aarch64/Image" "${{ github.workspace }}/AnyKernel3/Image"
          exit 0
        fi
        if [ -f "/home/runner/out/dist/Image" ]; then
          echo "Found Image at /home/runner/out/dist/Image"
          cp "/home/runner/out/dist/Image" "${{ github.workspace }}/AnyKernel3/Image"
          exit 0
        fi

        exit 1
