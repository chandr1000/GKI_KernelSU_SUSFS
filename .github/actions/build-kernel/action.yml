name: 'Build Kernel'
description: 'Builds kernel using legacy build.sh or Bazel (kleaf)'
inputs:
  version:
    description: 'Kernel config version (e.g., android14-6.1)'
    required: true
  kbuild_build_user:
    description: |
      Value for the KBUILD_BUILD_USER env var. Appears in `uname -v` as
      the user before the `@` (e.g., `wild@host`).
      Empty string = use the kernel's default.
      Sourced from env.WILD_BUILD_USER (set by root-setup from brand_name).
    required: false
    default: ''
  kbuild_build_host:
    description: |
      Value for KBUILD_BUILD_HOST. Appears in `uname -v` as the host
      after the `@` (e.g., `wild@KernelSU-Next-v30337`).
      Empty string = use the kernel's default.
      Sourced from env.WILD_BUILD_HOST (set by root-setup).
    required: false
    default: ''

runs:
  using: composite
  steps:
  - name: Setup Kernel Configs
    if: false
    uses: ./.github/actions/set-kernel-config
  
  - name: 'Build Kernel'
    shell: bash
    working-directory: ${{ github.workspace }}/kernel
    env:
      KBUILD_BUILD_USER: ${{ inputs.kbuild_build_user }}
      KBUILD_BUILD_HOST: ${{ inputs.kbuild_build_host }}
    run: |
      [ -n "$KBUILD_BUILD_USER" ] && export KBUILD_BUILD_USER
      [ -n "$KBUILD_BUILD_HOST" ] && export KBUILD_BUILD_HOST
      echo "KBUILD_BUILD_USER=${KBUILD_BUILD_USER:-(default)}"
      echo "KBUILD_BUILD_HOST=${KBUILD_BUILD_HOST:-(default)}"
      sed -i 's/check_defconfig//' ./common/build.config.gki
      if [ -f "build/build.sh" ]; then
        BUILD_GKI_ARTIFACTS="" \
        BUILD_GKI_CERTIFICATION_TOOLS=0 \
        BUILD_SYSTEM_DLKM=0 \
        SKIP_VENDOR_BOOT=1 \
        SKIP_EXT_MODULES=1 \
        SKIP_CP_KERNEL_HDR=1 \
        OUT_DIR="/home/runner/out" \
        LTO=thin \
        BUILD_CONFIG=common/build.config.gki.aarch64 \
        CC="/usr/bin/ccache clang" \
        CXX="/usr/bin/ccache clang++" \
        HOSTCC="/usr/bin/ccache clang" \
        HOSTCXX="/usr/bin/ccache clang++" \
        build/build.sh -j"$(nproc)"
      else
        sed -i '/name = "kernel_aarch64",/a\    check_defconfig = "disabled",' common/BUILD.bazel
        ACTION_ENV_FLAGS=""
        [ -n "$KBUILD_BUILD_USER" ] && ACTION_ENV_FLAGS="$ACTION_ENV_FLAGS --action_env=KBUILD_BUILD_USER"
        [ -n "$KBUILD_BUILD_HOST" ] && ACTION_ENV_FLAGS="$ACTION_ENV_FLAGS --action_env=KBUILD_BUILD_HOST"
        tools/bazel build \
          --config=fast \
          --config=stamp \
          $ACTION_ENV_FLAGS \
          --disk_cache=/home/runner/.cache/bazel \
          //common:kernel_aarch64/Image
      fi

  - name: 'Gather Build Artifacts'
    shell: bash
    working-directory: ${{ github.workspace }}/kernel
    run: |
      set -euo pipefail
      if [ -f "bazel-bin/common/kernel_aarch64/Image" ]; then
        echo "Found Image at bazel-bin/common/kernel_aarch64/Image"
        cp "bazel-bin/common/kernel_aarch64/Image" "${{ github.workspace }}/AnyKernel3/Image"
        exit 0
        fi
      if [ -f "/home/runner/out/dist/Image" ]; then
        echo "Found Image at /home/runner/out/dist/Image"
        cp "/home/runner/out/dist/Image" "${{ github.workspace }}/AnyKernel3/Image"
        exit 0
      fi

      exit 1

