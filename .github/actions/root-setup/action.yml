name: Setup pinned root implementation
description: Clone exactly one supported root implementation at a verified commit
inputs:
  flavor:
    description: 'kernelsu, next, resukisu, sukisu-ultra, or kowsu'
    required: true
  commit:
    description: 'Full immutable commit SHA'
    required: true
  brand_name:
    description: 'Branding text used as KBUILD_BUILD_USER in uname -v (default Wild)'
    required: false
    default: Wild

runs:
  using: composite
  steps:
    - name: Clone and integrate selected root
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail

        flavor="${{ inputs.flavor }}"
        expected_commit="${{ inputs.commit }}"
        case "$flavor" in
          kernelsu)
            repo="https://github.com/tiann/KernelSU.git"
            directory="KernelSU"
            manager="KernelSU Manager"
            ;;
          next)
            repo="https://github.com/KernelSU-Next/KernelSU-Next.git"
            directory="KernelSU-Next"
            manager="KernelSU Next Manager"
            ;;
          resukisu)
            repo="https://github.com/ReSukiSU/ReSukiSU.git"
            directory="ReSukiSU"
            manager="ReSukiSU Manager"
            ;;
          sukisu-ultra)
            repo="https://github.com/SukiSU-Ultra/SukiSU-Ultra.git"
            directory="SukiSU-Ultra"
            manager="SukiSU-Ultra Manager"
            ;;
          kowsu)
            repo="https://github.com/KOWX712/KernelSU.git"
            directory="KowSU"
            manager="KowSU Manager"
            ;;
          *)
            echo "Unsupported root flavor: $flavor" >&2
            exit 2
            ;;
        esac

        if ! [[ "$expected_commit" =~ ^[0-9a-f]{40}$ ]]; then
          echo "Root commit must be a full 40-character SHA." >&2
          exit 2
        fi

        for candidate in KernelSU KernelSU-Next ReSukiSU SukiSU-Ultra KowSU; do
          if [ "$candidate" != "$directory" ] && [ -e "$candidate" ]; then
            echo "Refusing mixed root implementations: found $candidate." >&2
            exit 1
          fi
        done

        if [ -d common/drivers ]; then
          drivers_dir="common/drivers"
        elif [ -d drivers ]; then
          drivers_dir="drivers"
        else
          echo "Kernel drivers directory not found." >&2
          exit 1
        fi

        if [ -e "$drivers_dir/kernelsu" ] || [ -L "$drivers_dir/kernelsu" ]; then
          echo "Refusing to replace an existing kernelsu integration." >&2
          exit 1
        fi
        if [ -e "$directory" ]; then
          echo "Refusing to reuse an existing root checkout: $directory." >&2
          exit 1
        fi

        git clone --no-checkout "$repo" "$directory"
        # Full (non-shallow) fetch: the commit count fed into the flavor version
        # scheme must cover the whole history. A --depth=1 fetch truncates the
        # graph and makes 'git rev-list --count' (and merge-base) report wrong
        # numbers, which desynchronizes the kernel-reported version from the
        # manager build (same failure mode the old KSUN version fix addressed).
        git -C "$directory" fetch origin "$expected_commit"
        if [ -f "$directory/.git/shallow" ]; then
          git -C "$directory" fetch --unshallow origin 2>/dev/null || true
        fi
        git -C "$directory" checkout --detach "$expected_commit"
        actual_commit="$(git -C "$directory" rev-parse HEAD)"
        if [ "$actual_commit" != "$expected_commit" ]; then
          echo "Root commit mismatch: expected $expected_commit, got $actual_commit." >&2
          exit 1
        fi
        if [ ! -f "$directory/kernel/Kconfig" ] || [ ! -f "$directory/kernel/Makefile" ]; then
          echo "Selected root checkout does not contain a kernel integration." >&2
          exit 1
        fi
        root_version="$(git -C "$directory" describe --tags --always --dirty)"

        relative_kernel="$(realpath --relative-to="$drivers_dir" "$PWD/$directory/kernel")"
        ln -s "$relative_kernel" "$drivers_dir/kernelsu"
        grep -q 'obj-$(CONFIG_KSU) += kernelsu/' "$drivers_dir/Makefile" ||
          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> "$drivers_dir/Makefile"
        grep -q 'source "drivers/kernelsu/Kconfig"' "$drivers_dir/Kconfig" ||
          sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' "$drivers_dir/Kconfig"

        echo "ROOT_IMPLEMENTATION=$flavor" >> "$GITHUB_ENV"
        echo "ROOT_MANAGER=$manager" >> "$GITHUB_ENV"
        echo "ROOT_VERSION=$root_version" >> "$GITHUB_ENV"
        echo "ROOT_COMMIT=$actual_commit" >> "$GITHUB_ENV"

    - name: Compute root flavor version and Wild branding env
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail

        flavor="${{ inputs.flavor }}"
        case "$flavor" in
          kernelsu)    directory="KernelSU";;
          next)        directory="KernelSU-Next";;
          resukisu)    directory="ReSukiSU";;
          sukisu-ultra) directory="SukiSU-Ultra";;
          kowsu)       directory="KowSU";;
          *) echo "Unsupported root flavor: $flavor" >&2; exit 2;;
        esac

        # Per-flavor version scheme, mirroring each flavor's kernel/Kbuild:
        #   kernelsu/next/kowsu : 30000 + commit count
        #   resukisu            : 30000 + commit count + 700
        #   sukisu-ultra        : 40000 + commit count - 2815
        # The count is taken from the merge-base with the flavor's base branch
        # (old KSUN way) so fork-only commits (e.g. pershoot dev-susfs) do not
        # inflate the version away from the matching official manager build.
        case "$flavor" in
          kernelsu)     base_branch="main";   ver_base=30000; ver_offset=0;;
          next)         base_branch="dev";    ver_base=30000; ver_offset=0;;
          resukisu)     base_branch="main";   ver_base=30000; ver_offset=700;;
          sukisu-ultra) base_branch="main";   ver_base=40000; ver_offset=-2815;;
          kowsu)        base_branch="master"; ver_base=30000; ver_offset=0;;
        esac

        base_commit="$(git -C "$directory" merge-base HEAD "refs/remotes/origin/$base_branch" 2>/dev/null || true)"
        if [ -z "$base_commit" ]; then
          # Pinned commit may live on another remote branch (e.g. builtin).
          while read -r ref; do
            base_commit="$(git -C "$directory" merge-base HEAD "$ref" 2>/dev/null || true)"
            [ -n "$base_commit" ] && break
          done < <(git -C "$directory" branch -r --format='%(refname:short)' --contains HEAD 2>/dev/null | grep '^origin/' || true)
        fi
        [ -n "$base_commit" ] || base_commit="HEAD"

        commits_count="$(git -C "$directory" rev-list --count "$base_commit" 2>/dev/null || echo 0)"
        root_flavor_version="$(expr "$ver_base" "+" "$commits_count" "+" "$ver_offset")"
        root_tag="$(git -C "$directory" describe --tags --abbrev=0 "$base_commit" 2>/dev/null || echo "")"
        root_tag="${root_tag:-unknown}"

        echo "Root flavor version: $root_flavor_version (base_commit=${base_commit:0:12}, count=$commits_count, tag=$root_tag)"

        # Pin the flavor version into its Kbuild so the value stays correct
        # inside the build sandbox, where the flavor's .git may be absent or
        # shallow and its own fallbacks (1 / 16 / 13000) would win instead.
        kbuild_file="$directory/kernel/Kbuild"
        if [ -f "$kbuild_file" ]; then
          if grep -q 'WILD_VERSION_PIN' "$kbuild_file"; then
            echo "$kbuild_file already pinned; skipping"
          else
            {
              echo ''
              echo '# WILD_VERSION_PIN: deterministic version set by CI (sandbox-proof)'
              echo 'ccflags-y := $(filter-out -DKSU_VERSION=%,$(ccflags-y)) -DKSU_VERSION='"$root_flavor_version"
              echo 'ccflags-y := $(filter-out -DKSU_VERSION_TAG=%,$(ccflags-y)) -DKSU_VERSION_TAG=\"'"$root_tag"'\"'
            } >> "$kbuild_file"
            echo "Pinned version $root_flavor_version into $kbuild_file"
          fi
        else
          echo "::warning::$kbuild_file not found; flavor version not pinned"
        fi

        # Wild branding env (consumed by apply-kernel-branding/build-kernel).
        brand_raw="${{ inputs.brand_name }}"
        brand="$(printf '%s' "$brand_raw" | tr '[:upper:]' '[:lower:]')"
        if ! printf '%s' "$brand" | grep -Eq '^[a-z0-9_.-]{1,32}$'; then
          echo "::warning::brand_name '$brand_raw' invalid after normalization; falling back to 'wild'"
          brand="wild"
        fi

        WILD_KSU_COMMIT="$(printf '%.12s' "$(git -C "$directory" rev-parse HEAD)")"
        WILD_BUILD_USER="$brand"
        WILD_BUILD_HOST="${directory}-v${root_flavor_version}"

        {
          echo "WILD_KSU_COMMIT=$WILD_KSU_COMMIT"
          echo "WILD_KSU_VERSION=$root_flavor_version"
          echo "WILD_BUILD_USER=$WILD_BUILD_USER"
          echo "WILD_BUILD_HOST=$WILD_BUILD_HOST"
          echo "WILD_KSU_FORK=$directory"
        } >> "$GITHUB_ENV"

    - name: Enable root configuration
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_KSU=y

    - name: Disable multi-manager for ReSukiSU
      if: inputs.flavor == 'resukisu'
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_KSU_MULTI_MANAGER_SUPPORT=n
          CONFIG_KSU_TOOLKIT_SUPPORT=y
